name: Generate orbital game-command release
on:
  push:
    branches: ['feat/orbital-shipyard-first-strike']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orbital-shipyard-first-strike
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Bundle current Edge Function
        run: |
          npx --yes esbuild@0.25.12 supabase/functions/game-command/index.ts --bundle --format=esm --platform=neutral --target=es2022 --external:npm:@supabase/supabase-js@2.117.2 --banner:js='// @ts-nocheck — Generated dashboard bundle; edit source modules instead.' --outfile=supabase/dashboard/game-command.ts
          cp supabase/dashboard/game-command.ts supabase/dashboard/game-command-gesamt.txt
          cp supabase/dashboard/game-command.ts supabase/dashboard/game-command-werft.txt
      - name: Archive source-backed Game Command
        run: |
          if git diff --quiet -- supabase/dashboard/game-command.ts; then
            echo 'No dashboard changes; existing version retained.'
            exit 0
          fi
          VERSION=$(node -e "const i=require('./supabase/releases/game-command/index.json');const all=i.releases.filter(r=>r.version.startsWith('2026-10-13.')).map(r=>Number(r.version.split('.').at(-1)));console.log('2026-10-13.'+String(Math.max(0,...all)+1).padStart(2,'0'))")
          npm run game-command:archive -- "$VERSION" "Orbitalwerft, modular bewaffnete Plattformen, Reparaturwarteschlange und Erstschlag Runde 0"
      - name: Commit bundled release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/dashboard/game-command.ts supabase/dashboard/game-command-gesamt.txt supabase/dashboard/game-command-werft.txt supabase/releases/game-command
          if ! git diff --cached --quiet; then
            git commit -m "Bundle and archive orbital defense Game Command"
            git push origin HEAD:feat/orbital-shipyard-first-strike
          fi
