name: Package Orbitalwerft Game Command 2026-10-13.01
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.head_ref == 'release/game-command-2026-10-13-01-orbital-yard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build single-file dashboard command
        run: |
          npx --yes esbuild@0.25.12 supabase/functions/game-command/index.ts --bundle --format=esm --platform=neutral --target=es2022 --external:npm:* --outfile=supabase/dashboard/game-command.ts
          node -e "const fs=require('fs');const p='supabase/dashboard/game-command.ts';const b='// @ts-nocheck — Generated dashboard bundle; edit source modules instead.\\n\\n'+fs.readFileSync(p,'utf8');fs.writeFileSync(p,b);for(const name of ['game-command-gesamt.txt','game-command-werft.txt'])fs.writeFileSync('supabase/dashboard/'+name,b)"
      - name: Verify orbital yard is included, obsolete weapons remain disabled
        run: |
          node --input-type=module -e "import{readFileSync as r}from'node:fs';const s=r('supabase/dashboard/game-command.ts','utf8');for(const phrase of ['Orbitalwerft','stillgelegt','orbital: Math.ceil(10 * Math.pow'])if(!s.includes(phrase))throw Error('Expected new game-command element missing: '+phrase);"
      - run: npm test
      - name: Archive immutable release
        run: |
          if git diff --quiet -- supabase/dashboard/game-command.ts; then echo 'Game-command unchanged'; else node scripts/archive-game-command.mjs 2026-10-13.01 "Orbitalwerft: permanenter Strombedarf, Erweiterung der Werftstufen; alte Orbitalwaffen gesperrt"; fi
      - name: Commit generated bundle and immutable archive
        run: |
          if git diff --quiet; then echo 'Already current'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/dashboard supabase/releases/game-command
          git commit -m "Archive Game Command 2026-10-13.01 for Orbitalwerft"
          git push origin HEAD:release/game-command-2026-10-13-01-orbital-yard
