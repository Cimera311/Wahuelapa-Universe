/* Public commander labels stay attached to each planet, with scroll space on mobile. */
.system-orbits-scroll{overflow-x:auto;border-radius:14px;margin:20px 0;overscroll-behavior-x:contain}
.system-orbits-scroll:focus-visible{outline:2px solid #55d9e9;outline-offset:3px}
.system-orbits-scroll .system-orbits{min-width:760px;height:360px;margin:0}
.system-orbits .orbit-target{width:44px;height:44px;min-width:44px;min-height:44px;overflow:visible}
.orbit-target .orbit-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:2px;width:100px;line-height:1.25;text-align:center;pointer-events:none;color:#dbe8f1;text-shadow:0 1px 3px #000}
.orbit-target.label-above .orbit-label{top:auto;bottom:100%}
.orbit-label>span{font-size:10px;white-space:nowrap}
.orbit-commander{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600;padding:3px 5px;background:#071824e8;border:1px solid #42566a;border-radius:5px}
.orbit-mine .orbit-commander{color:#55d9e9;border-color:#277786}
.orbit-foreign .orbit-commander{color:#f1c77d;border-color:#856c43}
.orbit-reserved .orbit-commander{border-style:dashed}

.orbit-target.label-right .orbit-label{top:50%;bottom:auto;left:100%;transform:translateY(-50%);margin-left:6px;text-align:left}

/* Shared transparent artwork for construction and research, sized for readable silhouettes. */
.item-icon.asset-item{width:88px;height:88px;padding:4px;border-color:#304b60;background:radial-gradient(at top left,#1c384c,#071521);overflow:hidden}
.asset-item img{display:block;width:100%;height:100%;object-fit:contain}
@media(max-width:760px){.item-icon.asset-item{width:64px;height:64px;padding:3px}.build-row:has(.asset-item) .item-copy{width:calc(100% - 77px)}}

// Read every page before aggregating. Never infer outcomes from a partial page.
async function loadBattleRound(read,mission,round){
 const first=await read(mission,round,0),shots=[...first.shots],impacts=[...first.impacts];
 const total=Math.max(first.shotTotal,first.impactTotal),limit=first.limit||200;
 for(let offset=limit;offset<total;offset+=limit){const page=await read(mission,round,offset);shots.push(...page.shots);impacts.push(...page.impacts);}
 if(shots.length!==first.shotTotal||impacts.length!==first.impactTotal)throw Error('Die Runde konnte nicht vollständig geladen werden.');

}

function summarizeRound(header,page){
 const units=new Map(header.initial.map(u=>[u.id,u])),pairs=new Map(),contributors=new Map();
 for(const shot of page.shots){
  const shooter=units.get(shot.shooter),target=units.get(shot.target);
  if(!shooter||!target)throw Error('Einheit im Kampfprotokoll fehlt.');
  const key=JSON.stringify([shooter.side,shooter.key,target.side,target.key]);
  if(!pairs.has(key))pairs.set(key,{shooter,target,shots:0,damage:0});
  const pair=pairs.get(key);pair.shots++;pair.damage+=shot.damage;
  if(!contributors.has(shot.target))contributors.set(shot.target,new Map());
  contributors.get(shot.target).set(shooter.key,shooter.name);
 }
 const outcomes=new Map();
 for(const hit of page.impacts){
  const target=units.get(hit.target),sources=[...(contributors.get(hit.target)||new Map())].sort(([a],[b])=>a.localeCompare(b));
  if(!target||!sources.length)throw Error('Treffer im Kampfprotokoll nicht zuordenbar.');
  const key=JSON.stringify([target.side,target.key,sources.map(([key])=>key)]);
  if(!outcomes.has(key))outcomes.set(key,{target,sources:sources.map(([,name])=>name),shield:0,hull:0,overkill:0,destroyed:0,surviving:0,hpAfter:0});
  const row=outcomes.get(key);row.shield+=hit.shieldDamage;row.hull+=hit.hullDamage;row.overkill+=hit.overkill;
  row.destroyed+=Number(hit.destroyed);row.surviving+=Number(!hit.destroyed);row.hpAfter+=hit.hpAfter;
 }
 return {pairs:[...pairs.values()],outcomes:[...outcomes.values()]};
}

function attackProgress(m,now){
 const leg=Math.max(1,m.returnAt-m.arrival),returning=m.status==='returning',start=returning?m.arrival:m.arrival-leg,end=returning?m.returnAt:m.arrival;
 const percent=Math.min(100,Math.max(0,100*(now-start)/leg));return {percent,start,end,leg,returning};
}
function flightClock(t){const seconds=Math.max(0,Math.ceil(t/1000));return (seconds>=3600?Math.floor(seconds/3600)+' Std ':'')+Math.floor(seconds%3600/60)+' Min '+seconds%60+' Sek';}
function flightPlanet(id,state,galaxy){
 const p=state.planets.find(p=>p.id===id)||galaxy?.planets?.find(p=>p.id===id&&p.surveyed);
 return p?'<img src="'+planetImagePath(p)+'" alt="" width="120" height="120" decoding="async">':'<span class="flight-unknown" aria-label="Planet noch nicht untersucht">?</span>';
}
function attackDistance(m,state,galaxy){
 const from=state.planets.find(p=>p.id===m.from),target=galaxy?.planets?.find(p=>p.id===m.to),system=galaxy?.systems?.find(s=>s.id===target?.system),origin=from?.system?from:state.galaxy||galaxy?.start;
 if(!origin||!target||!system)return null;
 return Math.max(1,Math.hypot(origin.x-system.x,origin.y-system.y)/40+Math.abs((from.system?from.slot:0)-target.slot)*.15);
}
function missionReports(m,pvp,cached=[]){
 const start=m.arrival-(m.returnAt-m.arrival),r=pvp.reports.find(r=>r.id===m.id);
 const fallback=[{id:'attack:'+m.id+':start',missionId:m.id,time:start,kind:'attack',title:'Angriff gestartet',payload:{from:m.from,to:m.to,fleet:m.fleet}}];
 if(r)fallback.push({id:'attack:'+m.id+':battle',missionId:m.id,time:r.at,kind:'battle',title:'Gefecht',payload:r});
 const map=new Map(fallback.map(r=>[r.id,r]));for(const r of cached)if(r.missionId===m.id)map.set(r.id,r);
 return [...map.values()].sort((a,b)=>b.time-a.time);
}
function attackCard(m,state,pvp,galaxy,now=pvp.serverNow,cached=[],opened=new Set()){

function pvpEstimate(state,galaxy,to,fleet){
 const target=galaxy?.planets.find(p=>p.id===to),system=galaxy?.systems.find(s=>s.id===target?.system);
 if(!target||!system)throw Error('Ziel fehlt.');
 const f=attackFlight(state,state.planets.find(p=>p.id===state.active),{...system,system:target.system,slot:target.slot},fleet);
 return pvpDuration(f.ms)+' je Strecke · '+f.fuel+' Treibstoff insgesamt · langsamstes Schiff: '+SHIPS[f.slowest].name;
}

const fleetArt=key=>SHIPS[key].asset||`./assets/${SHIPS[key].image||key}.webp`;

// Only available orbiting units belong here. Missions are displayed separately.
function fleetInventory(planets,category='all'){
 return Object.entries(SHIPS).filter(([,s])=>category==='all'||s.category===category).map(([key,ship])=>{
  const locations=planets.filter(p=>Number(p.ships?.[key])>0).map(p=>({planet:p,count:Number(p.ships[key])}));
  return {key,ship,locations,total:locations.reduce((sum,p)=>sum+p.count,0)};
 }).filter(row=>row.total>0).sort((a,b)=>b.total-a.total||a.ship.name.localeCompare(b.ship.name,'de'));
}

function fleetOverviewHTML(planets,{group='ship',category='all',expanded=new Map(),mobile=false}={}){
 const inventory=fleetInventory(planets,category);
 const controls=(items,action,value)=>items.map(([key,label])=>`<button type="button" data-action="${action}" data-value="${key}" aria-pressed="${value===key}">${label}</button>`).join('');
 const picture=(src)=>`<img src="${stockEscape(src)}" alt="" loading="lazy" decoding="async">`;
 const detail=(key,title,art,total,body,index)=>`<details class="fleet-stock-card" data-fleet-detail="${stockEscape(key)}" ${(expanded.has(key)?expanded.get(key):!mobile||index===0)?'open':''}><summary>${picture(art)}<span><strong>${stockEscape(title)}</strong><span class="fleet-stock-total">${fleetNumber(total)} <small>im Orbit</small></span></span><span class="fleet-stock-chevron" aria-hidden="true">⌄</span></summary><div class="fleet-stock-body">${body}</div></details>`;
 const row=(art,name,count,note='')=>`<div class="fleet-stock-row">${picture(art)}<span>${stockEscape(name)}${note?`<small>${stockEscape(note)}</small>`:''}</span><strong>${fleetNumber(count)}</strong></div>`;
 const cards=group==='ship'?inventory.map((item,i)=>detail('ship:'+item.key,item.ship.name,fleetArt(item.key),item.total,`<p class="fleet-stock-label">Standorte</p>${item.locations.map(({planet,count})=>row(planetImagePath(planet),planet.name,count,planet.coord||'')).join('')}`,i)).join(''):planets.map((p,i)=>{
  const items=inventory.filter(item=>item.locations.some(loc=>loc.planet.id===p.id));
  const total=items.reduce((n,item)=>n+Number(p.ships[item.key]),0);
  const body=items.length?fleetFilters.slice(1).map(([key,label])=>{const matching=items.filter(item=>item.ship.category===key);return matching.length?`<p class="fleet-stock-label">${label}</p>${matching.map(item=>row(fleetArt(item.key),item.ship.name,p.ships[item.key])).join('')}`:'';}).join(''):`<p class="fine">${category==='all'?'Keine Einheiten im Orbit.':'Keine Einheiten dieser Kategorie.'}</p>`;
  return detail('planet:'+p.id,p.name,planetImagePath(p),total,body,i);
 }).join('');
 return `<div class="fleet-stock-heading"><div><h2>Gesamte Flotte</h2><p class="fine">Alle eigenen Planeten im Überblick · Einheiten im Orbit</p></div><div class="fleet-stock-switch" role="group" aria-label="Flotte gruppieren">${controls([['ship','Nach Schiff'],['planet','Nach Planet']],'fleet-group',group)}</div></div><div class="fleet-stock-filters" role="group" aria-label="Einheiten filtern">${controls(fleetFilters,'fleet-filter',category)}</div><div class="fleet-stock-grid">${cards||'<p class="fine" role="status">Keine Einheiten dieser Kategorie im Orbit.</p>'}</div>`;
}

// A separate modal owns its requests and timer. Game rendering cannot erase a draft.
function openCommunity(kind,context){
 if(!['chat','wish'].includes(kind))return;
 document.querySelector('dialog')?.remove();
 const d=document.createElement('dialog');d.className='community-dialog';d.setAttribute('aria-labelledby','community-heading');
 const wish=kind==='wish';let rows=[],admin=false,busy=false,loading=false,more=false,oldest=null,timer=null,request=null,account=context().cloud?.user?.id;
 d.innerHTML=`<form method="dialog" class="community-close"><button aria-label="Schließen">×</button></form><div class="page-heading"><span class="eyebrow">COMMUNITY</span><h1 id="community-heading">${wish?'Wünsche & Ideen':'Universum-Chat'}</h1><p>${wish?'Was wünschst du dir für WaHueLaPa? Teile deine Idee und unterstütze andere.':'Ein gemeinsamer Treffpunkt für alle Commander.'}</p></div><p class="community-identity fine"></p><div class="community-toolbar"><button type="button" data-community-refresh>Aktualisieren</button><span class="fine">${wish?'Neueste Ideen zuerst':'Aktualisiert alle 15 Sekunden'}</span></div><p class="community-error" role="status" aria-live="polite"></p><button type="button" data-community-older hidden>Ältere Beiträge laden</button><div class="community-feed" role="${wish?'region':'log'}" aria-label="${wish?'Wünsche':'Chatnachrichten'}" aria-live="${wish?'off':'polite'}" aria-relevant="additions text"><p class="muted">Beiträge werden geladen …</p></div><form class="community-compose">${wish?'<label>Titel<input name="title" minlength="3" maxlength="80" required placeholder="Deine Idee in einem Satz"></label>':''}<label>${wish?'Dein Wunsch':'Deine Nachricht'}<textarea name="body" rows="${wish?4:2}" maxlength="${wish?3000:800}" required placeholder="${wish?'Beschreibe, was dir fehlt oder was du verbessern möchtest.':'Schreib etwas an alle …'}"></textarea></label><div class="community-compose-footer"><span class="fine">${wish?'Bis 3.000 Zeichen · ein Wunsch pro Minute':'Bis 800 Zeichen · 5 Sekunden Abstand'}</span><button type="submit">${wish?'Wunsch veröffentlichen':'Senden'}</button></div></form>`;
 document.body.append(d);d.showModal();
 const feed=d.querySelector('.community-feed'),form=d.querySelector('.community-compose'),error=d.querySelector('.community-error');
 const stop=()=>{clearInterval(timer);timer=null;};d.addEventListener('close',stop);
 const live=()=>{if(!d.isConnected||!d.open){stop();return false;}if(account!==context().cloud?.user?.id){stop();feed.replaceChildren();form.hidden=true;error.textContent='Dein Konto hat sich geändert. Öffne den Bereich erneut.';return false;}return true;};
 function update(){const bottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<50,position=feed.scrollTop;const html=communityRows(rows,kind,admin);if(feed.innerHTML!==html)feed.innerHTML=html;if(kind==='chat'&&bottom)feed.scrollTop=feed.scrollHeight;else feed.scrollTop=position;d.querySelector('[data-community-older]').hidden=!more;}
 function controls(){d.querySelectorAll('[data-community-op], [data-community-status], .community-compose button, .community-compose input, .community-compose textarea').forEach(b=>b.disabled=busy);}
 async function load(older=false){
  if(!live()||loading)return;const {cloud,state}=context();
  if(!cloud?.user){form.hidden=true;feed.innerHTML='<p class="community-empty">Melde dich an, um den gemeinsamen Chat und die Wünsche zu nutzen.</p>';return;}
  d.querySelector('.community-identity').textContent='Du schreibst als '+(state?.name||'Commander');form.hidden=false;loading=true;
  try{const data=await cloud.community(kind,{before:older?oldest:null});if(!live())return;admin=data.isAdmin;rows=[...new Map([...rows,...data.items].map(p=>[p.id,p])).values()];if(older||oldest===null){more=data.hasMore;oldest=data.items.length?Math.min(...data.items.map(p=>p.id)):oldest;}error.textContent='';update();controls();}
  catch(e){if(live()){error.textContent=e.message||'Beiträge konnten nicht geladen werden.';if(!rows.length)feed.innerHTML='<p class="community-empty">Die Community ist gerade nicht erreichbar. Versuche es erneut.</p>';}}
  finally{loading=false;}
 }
 async function mutate(params){
  if(busy||!live())return false;const {cloud}=context();if(!cloud?.user)return false;busy=true;controls();error.textContent='';
  try{await cloud.community(kind,params);if(!live())return false;return true;}catch(e){if(live())error.textContent=e.message||'Beitrag konnte nicht gespeichert werden.';return false;}finally{busy=false;if(live())controls();}
 }
 form.addEventListener('submit',async e=>{e.preventDefault();const body=form.elements.body.value.trim(),title=wish?form.elements.title.value.trim():'';if(!body)return;if(!request||request.body!==body||request.title!==title)request={body,title,request:crypto.randomUUID()};if(await mutate({op:'post',...request})){form.reset();request=null;await load();form.elements.body.focus();}});
 d.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-community-refresh'))await load();if(b.hasAttribute('data-community-older'))await load(true);if(b.dataset.communityOp){const id=Number(b.dataset.id),op=b.dataset.communityOp;if(await mutate({op,id,vote:b.dataset.vote==='true'})){if(op==='delete'){rows=rows.map(p=>p.id===id?{...p,deleted:true}:p);update();}else if(op==='vote'){rows=rows.map(p=>p.id===id?{...p,voted:b.dataset.vote==='true',votes:p.votes+(b.dataset.vote==='true'?1:-1)}:p);update();}await load();}}});
 d.addEventListener('change',async e=>{const id=Number(e.target.dataset.communityStatus);if(!id)return;const status=e.target.value;if(await mutate({op:'status',id,status})){rows=rows.map(p=>p.id===id?{...p,status}:p);update();await load();}else update();});
 void load();timer=setInterval(()=>{if(live()&&!document.hidden&&!busy)void load();},15000);
 return d;
}

function routeStopRow(id,first=false,stop=null){const q=getPlanet(state,id),load=stop?.load||vector([0,0,0]),unload=stop?.unload||(first?vector([0,0,0]):{metal:'max',crystal:'max',fuel:'max'}),has=o=>RES.some(k=>o[k]==='max'||o[k]>0),mode=has(load)&&has(unload)?'both':has(load)||first?'load':'unload';return `<fieldset class="route-stop"><legend>${first?'Startplanet':'Stopp'}</legend><details open><summary>${orb(q,'small')}<strong>${esc(q.name)}</strong><span>Bearbeiten</span></summary><div class="stop-content"><label>Planet<select name="stop-planet" ${first?'disabled':''}>${planetOptions(id)}</select></label>${first?'':`<div class="stop-tools"><button type="button" data-action="move-stop" data-dir="-1">←</button><button type="button" data-action="move-stop" data-dir="1">→</button><button type="button" data-action="remove-stop">Entfernen</button></div>`}<label>Aktion am Stopp<select name="stop-mode">${[['unload','Entladen'],['load','Beladen'],['both','Entladen / Beladen']].map(([k,n])=>`<option value="${k}" ${mode===k?'selected':''}>${n}</option>`).join('')}</select></label><div data-stop-section="unload" ${mode==='load'?'hidden':''}><h4>Entladen</h4>${cargoFields('unload-',unload)}</div><div data-stop-section="load" ${mode==='unload'?'hidden':''}><h4>Beladen</h4>${cargoFields('load-',load)}</div><p class="fine">${RES.map(k=>`${LABEL[k]}: <span data-stock="${k}">${fmt(q.resources[k]+q.depot[k])}</span>`).join(' · ')}. Erst entladen, dann beladen.</p></div></details></fieldset>`;}

function manifestText(m){return Object.entries(fleetManifest(m)).map(([k,n])=>`${n} × ${SHIPS[k].name}`).join(' + ');}
function fleetDispatchAction(action){
 if(!['deliver','collect','station'].includes(action.type)||!action.fleet)return action;
 const entries=Object.entries(action.fleet);
 if(entries.length>1&&cloud?.authoritative&&cloud.pvp?.features?.fleetPlanning!==true)throw Error('Der Spielserver unterstützt noch keine gemischten Flottenaufträge. Wähle vorerst einen Schiffstyp; für gemischte Flotten muss die aktuelle Game-command bereitgestellt werden.');
 // Keep the single-ship contract alongside the manifest during staged deploys.
 return entries.length===1?{...action,ship:entries[0][0],count:entries[0][1]}:action;
}
function readMixedFleet(form){return Object.fromEntries([...form.querySelectorAll('[data-fleet-ship]')].map(el=>[el.dataset.fleetShip,Number(el.value)]).filter(([,n])=>n!==0));}
function routeSubmenu(){return `<div class="route-submenu" role="tablist" aria-label="Handelsrouten-Menü">${[['existing','≡ Bestehende Routen'],['new','+ Neue Route']].map(([key,label])=>`<button type="button" role="tab" id="route-tab-${key}" aria-controls="route-content" aria-selected="${routeSection===key}" tabindex="${routeSection===key?0:-1}" data-action="route-${key}">${label}</button>`).join('')}</div>`;}
function routeMatches(m){const status=m.awaitingUnload?'unloading':m.paused?'paused':m.pauseRequested?'pausing':m.stopping?'ending':m.to===m.home?'return':'outbound';const words=[m.name,manifestText(m),...m.stops.map(q=>getPlanet(state,q.planet).name)].join(' ').toLocaleLowerCase('de-DE');return words.includes(routeQuery.toLocaleLowerCase('de-DE').trim())&&(routeFilter==='all'||routeFilter===status||routeFilter==='pending'&&!!m.pending);}
function routeCard(m,applyFilter=true){const fleet=fleetManifest(m),returning=m.to===m.home,status=m.awaitingUnload?'Wartet auf Lagerplatz · Schiffe gebunden':m.paused?'Pausiert · Schiffe gebunden':m.pauseRequested?'Pause nach dieser Runde':m.stopping?'Endet nach dieser Runde':returning?'Rückkehr':'Unterwegs',percent=Math.round(Math.min(100,Math.max(0,100*(state.time-m.start)/m.duration)));return `<article class="trade-route route-card" ${applyFilter?`data-route-card="${m.id}"`:""} ${!applyFilter||routeMatches(m)?'':'hidden'}><div class="route-card-heading"><h3>${esc(m.name)}</h3><span class="route-status ${m.stopping?'ending':returning?'returning':''}">${status}</span><span class="route-round">Runde ${m.rounds+1} · ${m.repeat?'Endlos':'Eine Runde'}</span></div><div class="route-path" aria-label="Flugreihenfolge">${[...m.stops.map(q=>q.planet),m.home].map((id,i)=>`${i?'<span class="route-arrow" aria-hidden="true">→</span>':''}<div class="route-world">${orb(getPlanet(state,id),'small')}<span>${esc(getPlanet(state,id).name)}</span></div>`).join('')}</div><div class="route-freight"><div class="route-ships">${Object.entries(fleet).map(([k,n])=>`<span><img src="./assets/${SHIPS[k].image||k}.webp" alt=""><strong>${n} × ${esc(SHIPS[k].name)}</strong></span>`).join('')}</div><div class="route-cargo-metrics"><div><strong>${fmt(fleetCapacity(state,fleet))}</strong><small>Laderaum</small></div><div><strong>${costHTML(m.cargo)||'Leer'}</strong><small>Aktuelle Fracht</small></div></div></div><div class="route-travel"><div class="route-next">Nächster Stopp: <strong>${esc(getPlanet(state,m.to).name)}</strong></div><div class="route-flight-progress" ${m.paused||m.awaitingUnload?'hidden':''} role="progressbar" aria-label="Fortschritt zur nächsten Welt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" data-route-progress="${m.id}"><i style="width:${percent}%"></i></div><div class="route-arrival">${m.awaitingUnload?'Restladung an Bord · wartet auf Lagerplatz':m.paused?'Wartet am Startplaneten':`Ankunft in <strong data-due="${m.due}">${duration(m.due-state.time)}</strong>`}</div><div class="route-actions">${button('✎ Bearbeiten','route-edit',`data-id="${m.id}" aria-label="Route ${esc(m.name)} bearbeiten"`,m.stopping||m.awaitingUnload||readOnly)}${routePauseButton(m)}${button(m.stopping?'Beendigung vorgemerkt':'Beenden','stop-route',`data-id="${m.id}" aria-label="Route ${esc(m.name)} beenden"`,m.stopping||readOnly)}</div></div>${m.pending?`<div class="route-pending"><span>◷ Änderung vorgemerkt · bei Rückkehr nach ${esc(getPlanet(state,m.home).name)}</span>${button('Verwerfen','cancel-route-edit',`data-id="${m.id}" aria-label="Vormerkung für ${esc(m.name)} verwerfen"`,readOnly)}</div>`:''}</article>`;}
function routeOverview(routes){return `<section class="route-dashboard"><div class="route-dashboard-heading"><div><h2>Deine Handelsrouten <span class="route-total">${routes.length}</span></h2><p class="fine">Normale Flugzeit · −25 % Treibstoff je Handelsrouten-Strecke.</p></div><div class="route-filters"><label class="route-search">Route suchen<input id="route-search" type="search" value="${esc(routeQuery)}" placeholder="Name, Planet oder Schiff …"></label><label>Status<select id="route-filter">${[['all','Alle Routen'],['unloading','Wartet auf Lagerplatz'],['paused','Pausiert'],['pausing','Pause vorgemerkt'],['outbound','Unterwegs'],['return','Rückkehr'],['pending','Änderung vorgemerkt'],['ending','Wird beendet']].map(([key,label])=>`<option value="${key}" ${routeFilter===key?'selected':''}>${label}</option>`).join('')}</select></label></div></div><div class="route-cards">${routes.map(m=>routeCard(m)).join('')}</div><div id="route-no-results" class="panel route-empty" ${routes.some(routeMatches)?'hidden':''}><h3>${routes.length?'Keine passende Route':'Noch keine Handelsrouten'}</h3><p>${routes.length?'Ändere die Suche oder den Statusfilter.':'Verbinde deine Welten mit einer regelmäßigen Versorgung.'}</p>${routes.length?'':button('+ Erste Route erstellen','route-new')}</div></section>`;}
function filterRouteCards(){const routes=state.missions.filter(m=>m.type==='route');for(const el of document.querySelectorAll('[data-route-card]')){const m=routes.find(m=>m.id===Number(el.dataset.routeCard));el.hidden=!m||!routeMatches(m);}const empty=document.getElementById('route-no-results');if(empty)empty.hidden=routes.some(routeMatches);}
function tradeRoutes(p){const routes=state.missions.filter(m=>m.type==='route'),editing=routeSection==='existing'?routes.find(m=>m.id===routeEditId):null,model=editing?.pending||editing,home=editing?getPlanet(state,editing.home):p,old=editing?fleetManifest(editing):{},fleet=model?(model.fleet||fleetManifest(model)):{},stops=model?.stops||[{planet:home.id,load:vector([0,0,0]),unload:vector([0,0,0])},{planet:state.planets.find(q=>q.id!==home.id)?.id,load:vector([0,0,0]),unload:{metal:'max',crystal:'max',fuel:'max'}}];return `${routeSubmenu()}<div id="route-content" role="tabpanel" aria-labelledby="route-tab-${routeSection}">${routeSection==='existing'&&!editing?routeOverview(routes):`<section class="panel trade-editor"><div class="split"><h2>${editing?'Route bearbeiten · '+esc(editing.name):'Neue Handelsroute'}</h2>${button('← Zur Routenübersicht','route-existing')}</div>${state.planets.length<2?'<p>Besiedle eine zweite Welt, um Handelsrouten anzulegen.</p>':`<form id="route-form" data-planet="${home.id}" data-route-id="${editing?.id||0}"><div class="form-grid"><label>Routenname<input name="name" maxlength="40" required value="${esc(model?.name||'Handelsroute')}"></label><label>Betrieb<select name="repeat"><option value="true" ${model?.repeat===false?'':'selected'}>Endlos wiederholen</option><option value="false" ${model?.repeat===false?'selected':''}>Eine Runde</option></select></label></div><details class="mixed-fleet-picker" open><summary>Flotte zusammenstellen · Startplanet ${esc(home.name)}</summary><p class="fine">Vorgemerkte Schiffe bleiben bis zum Wechsel für andere Aufträge verfügbar.</p>${fleetPicker(state,home,{fleet,extra:old})}</details><div class="route-estimate" id="route-estimate" role="status"></div><h3>Stopps in Flugreihenfolge</h3><p class="fine">Erst abladen, dann einladen. Nach dem letzten Stopp kehrt die Flotte zum Startplaneten zurück und lädt soweit möglich ab. Volle Lager lassen Restladung an Bord; sie belegt weiterhin Laderaum.</p><div id="route-stops" class="route-stops">${stops.map((q,i)=>routeStopRow(q.planet,i===0,q)).join('')}</div><button type="button" data-action="add-stop">+ Stopp hinzufügen</button><p class="fine">+5 % addiert bei jedem Klick fünf Prozent des ausgewählten Laderaums. Nach MAX beginnt eine feste Menge wieder bei 0. MAX bleibt dynamisch: verfügbare Menge bis zum freien Laderaum. Ladereihenfolge: Metall → Kristall → Treibstoff. Bestände sind aktuelle Vorschauen, geladen wird bei Ankunft. Bei vollem Lager bleibt Restladung im Frachter und fährt zum nächsten Stopp mit.</p>${editing?'<div class="pending-change">'+(editing.paused?'Änderungen werden jetzt am Startplaneten übernommen. ':'Änderungen werden gemeinsam bei Rückkehr zum Startplanet aktiviert. ')+ ' Fehlen Schiffe, bleibt die bisherige Route aktiv und die Änderung vorgemerkt.</div>':''}<div class="trade-save"><button type="submit" ${readOnly?'disabled':''}>${editing?(editing.paused?'Änderungen speichern':'Änderungen vormerken'):'Handelsroute starten'}</button>${editing?routePauseButton(editing)+button('Route beenden','stop-route',`data-id="${editing.id}"`)+button('Zur Routenübersicht','route-existing'):''}</div></form>`}</section>`}</div>`;}

function fleetMissions(missions){return '<div class="route-cards">'+missions.map(m=>{

 return fleetTravelCard({title:({station:'Stationieren',collect:'Abholen',deliver:'Lieferung',transport:'Lieferung',probe:'Erkundung',colony:'Kolonisierung'})[m.type]||'Flottenauftrag',status:m.awaitingUnload?'Wartet auf Lagerplatz · Schiffe gebunden':returning?'Rückflug':'Unterwegs',worlds:(returning?[m.to,m.from]:[m.from,m.to]).map(fleetWorld),fleet:f,cargoHTML:costHTML(m.cargo),capacity:fleetCapacity(state,f),info:m.type==='collect'&&!returning?'Material wird am Ziel abgeholt.':m.type==='colony'?'Das Kolonieschiff gründet am Ziel eine neue Kolonie.':'',due:progress.end,start:progress.start,now:state.time,waiting:!!m.awaitingUnload,clock:m.awaitingUnload?'Restladung bleibt an Bord':duration(m.due-state.time)});
 }).join('')+'</div>'+(missions.length?'':'<p class="muted">Keine lokalen Flotten unterwegs.</p>');}

 <section class="panel"><h2>Lokale Materialreserve</h2><p class="fine">Diese Mengen bleiben bei Flottenbeladung auf ${esc(p.name)}. Bau und Forschung dürfen sie verwenden.</p><form id="reserve-form" data-planet="${p.id}"><div class="form-grid">${RES.map(k=>`<label>${LABEL[k]}<input name="${k}" type="number" min="0" max="1000000000000" step="1" value="${p.reserves?.[k]||0}" required></label>`).join('')}</div><button ${readOnly?'disabled':''}>Reserven speichern</button></form></section>

function fleetDraftKey(planet){return `${cloud?.user?.id||'guest'}:${planet}`;}
function captureFleetDraft(){for(const id of ['fleet-order-form','route-form','reserve-form','social-flight-form','social-invite-form']){const form=document.getElementById(id);if(!form)continue;const key=fleetDraftKey(form.dataset.planet)+(id==='route-form'?':route:'+form.dataset.routeId:id==='social-flight-form'?':social:'+form.dataset.op:''),draft=fleetDrafts.get(key)||{};draft[id]={fields:[...form.elements].filter(el=>el.name).map(el=>({name:el.name,value:el.value,checked:el.checked})),stops:id==='route-form'?readRouteStops(form):null};fleetDrafts.set(key,draft);}}

async function loadAccount(discardLocal=false){if(galaxyBusy)return;cloudBlocked=true;cloudMessage='Cloud-Spielstand wird geladen …';refreshCloudBadge();try{let remote=await cloud.load();if(readOnly)return;if(!remote){accountSetup();return;}let meta=null,cached=null;try{meta=JSON.parse(localStorage.getItem(saveKey()+'-cloud-meta')||'null');cached=loadGame(localStorage,saveKey()).state;}catch{toast('Lokale Kontosicherung beschädigt. Cloud-Stand wird verwendet.');}if(!cloud.authoritative&&!discardLocal&&meta?.pending&&cached){state=advance(cached,Date.now());activeAccountId=cloud.user.id;if(meta.revision!==cloud.revision){cloudMessage='⚠ Lokaler Stand und Cloud unterscheiden sich · exportieren oder Cloud laden';toast('Nicht synchronisierte lokale Änderungen gefunden. Exportiere sie oder lade bewusst den Cloud-Stand.');settings();return;}remote=state;}state=advance(remote,gameNow());activeAccountId=cloud.user.id;cloudBlocked=false;cloudDirty=true;cloudMessage='● Cloud geladen · lokale Sicherung aktiv';try{saveGame(state,localStorage,saveKey());storageOK=true;}catch{storageOK=false;toast('Lokale Sicherung nicht möglich. Bitte exportieren.');}document.querySelector('dialog')?.remove();render();}catch(e){if(activeAccountId!==cloud?.user?.id){try{const cached=loadGame(localStorage,saveKey()).state;if(cached){state=cached;activeAccountId=cloud.user.id;}}catch{}}cloudMessage='⚠ Cloud konnte nicht geladen werden';refreshCloudBadge();toast(e.message||'Cloud nicht erreichbar.');settings();}}
async function flushCloud(){if(readOnly||!cloud?.user||cloudBlocked||cloudSaving||!state)return false;cloudSaving=true;cloudLastAttempt=Date.now();const generation=cloudGeneration;const snapshot=structuredClone(state);cloudMessage='Cloud wird gespeichert …';refreshCloudBadge();try{if(cloud.authoritative){const oldSeq=state.seq,oldPvP=JSON.stringify({...cloud.pvp,serverNow:0});adoptServer(await cloud.gameRequest({type:'sync'}));if(oldSeq!==state.seq||oldPvP!==JSON.stringify({...cloud.pvp,serverNow:0}))render();return true;}await cloud.save(snapshot);cloudDirty=cloudGeneration!==generation;cloudLastSave=Date.now();try{localStorage.setItem(saveKey()+'-cloud-meta',JSON.stringify({revision:cloud.revision,pending:cloudDirty}));}catch{}cloudMessage=`● Cloud gespeichert · ${new Date(cloudLastSave).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`;return true;}catch(e){cloudMessage='⚠ Nur lokal gesichert · Cloud erneut versuchen';if(e instanceof CloudConflict){cloudBlocked=true;cloudMessage='⚠ Anderes Gerät gespeichert · Cloud neu laden';toast(e.message);settings();}else toast(e.message||'Cloud-Speicherung fehlgeschlagen. Lokale Sicherung bleibt erhalten.');return false;}finally{cloudSaving=false;refreshCloudBadge();if(tab==='leaderboard')void refreshRanking();if(tab==='fleet'&&['reports','pvp','defense'].includes(fleetSection))void refreshReports();const status=document.getElementById('cloud-status');if(status)status.textContent=cloudMessage;}}

   container.innerHTML=battleLogView(header,page,{round,offset});container.scrollTop=0;
  }catch(error){if(seq===request&&d.isConnected&&account===cloud?.user?.id){container.replaceChildren();const p=document.createElement('p');p.textContent=['PGRST202','42883'].includes(error.code)?'Für vollständige Protokolle fehlt noch die Supabase-Erweiterung combat-logs.sql.':error.message||'Kampfprotokoll konnte nicht geladen werden.';const retry=document.createElement('button');retry.textContent='Erneut laden';retry.addEventListener('click',()=>void show(round,offset));container.append(p,retry);}}
  finally{if(seq===request)container.removeAttribute('aria-busy');}
 }
 d.addEventListener('click',event=>{const q=event.target.closest('[data-battle-round]');if(q&&!q.disabled)void show(Number(q.dataset.battleRound),Number(q.dataset.battleOffset));});
 await show();
});

document.addEventListener('click',e=>{const b=e.target.closest('[data-action="pvp-select-all"],[data-action="pvp-select-none"]');if(!b)return;const form=b.closest('#pvp-attack-form');if(!form)return;for(const input of form.querySelectorAll('[data-fleet-ship]'))input.value=b.dataset.action==='pvp-select-all'?input.max:0;updatePvPEstimate(form);});

// Partner forms use the authoritative endpoint; a guest never writes social state.
document.addEventListener('click',async e=>{const b=e.target.closest('[data-social-op],[data-social-mode]');if(!b||b.disabled)return;if(b.dataset.socialMode){socialMode=b.dataset.socialMode;render();return;}await serverAction({type:'social',action:{op:b.dataset.socialOp,id:b.dataset.socialId}});});
document.addEventListener('submit',async e=>{const form=e.target;if(!['social-invite-form','social-flight-form'].includes(form.id)&&!form.classList.contains('social-rights-form'))return;e.preventDefault();const d=new FormData(form);let action;if(form.id==='social-invite-form')action={op:'invite',friend:d.get('friend'),delivery:d.has('delivery'),defense:d.has('defense')};else if(form.classList.contains('social-rights-form'))action={op:form.dataset.op,id:form.dataset.id,delivery:d.has('delivery'),defense:d.has('defense')};else{const quantities=prefix=>Object.fromEntries(RES.map(k=>[k,Number(d.get(prefix+k)||0)]));action={op:form.dataset.op,from:state.active,to:d.get('to'),fleet:Object.fromEntries(Object.keys(SHIPS).filter(k=>Number(d.get('fleet-'+k))>0).map(k=>[k,Number(d.get('fleet-'+k))])),cargo:quantities('cargo-'),payment:quantities('payment-')};}await serverAction({type:'social',action});});
function socialEstimate(){
 const form=document.getElementById('social-flight-form');if(!form)return;const output=document.getElementById('social-estimate'),submit=form.querySelector('[type=submit]');
 try{const d=new FormData(form),from=getPlanet(state,state.active),to=cloud?.pvp?.social?.partners.flatMap(p=>p.planets).find(p=>p.id===d.get('to')),fleet=readMixedFleet(form);if(!to)throw Error('Wähle eine freigegebene Zielkolonie.');if(!from.system&&cloud?.authoritative&&!cloud.pvp?.features?.partnerOrigins)throw Error('Partnerflotten von Heimat- und Tutorialplaneten benötigen ein Serverupdate.');if(!Object.keys(fleet).length)throw Error('Wähle deine Flotte.');let ms=0,fuel=0,slowest='';const remote=(from.system||'tutorial')!==(to.system||'tutorial');for(const [key,count] of Object.entries(fleet)){if(!Number.isSafeInteger(count)||count<1||count>from.ships[key])throw Error('Nicht genügend verfügbare Schiffe.');if(remote&&!canFlyInterstellar(state,key))throw Error(SHIPS[key].name+': Für diesen Flug fehlt ein geeigneter Galaxieantrieb.');const f=sharedFlight(state,from,to,count,key);if(f.ms>ms){ms=f.ms;slowest=key;}fuel+=2*f.fuel;}
 const cargo=Object.fromEntries(RES.map(k=>[k,Number(d.get('cargo-'+k)||0)])),payment=Object.fromEntries(RES.map(k=>[k,Number(d.get('payment-'+k)||0)])),cap=fleetCapacity(state,fleet);if([...Object.values(cargo),...Object.values(payment)].some(n=>!Number.isSafeInteger(n)||n<0))throw Error('Wähle ganze, positive Rohstoffmengen.');if(Object.values(cargo).reduce((a,b)=>a+b,0)>cap||Object.values(payment).reduce((a,b)=>a+b,0)>cap)throw Error('Die Ladung überschreitet den Laderaum.');if(RES.some(k=>from.resources[k]<(cargo[k]+(k==='fuel'?fuel:0))))throw Error('Rohstoffe oder Treibstoff für Hin- und Rückflug reichen nicht.');if(form.dataset.op!=='support'&&!Object.values(cargo).some(n=>n>0))throw Error('Wähle eine positive Lieferung.');if(form.dataset.op==='trade-offer'&&!Object.values(payment).some(n=>n>0))throw Error('Wähle eine positive Gegenleistung.');output.textContent='Je Strecke '+duration(ms)+' · Hin- und Rückflug: '+fuel.toLocaleString('de-DE')+' Treibstoff. '+SHIPS[slowest].name+' bestimmt das Tempo.';output.classList.remove('requirement');submit.disabled=readOnly||cloudBlocked||galaxyBusy||cloudSaving;
 }catch(e){output.textContent=e.message;output.classList.add('requirement');submit.disabled=true;}
}
document.addEventListener('input',e=>{if(e.target.closest('#social-flight-form'))socialEstimate();});document.addEventListener('change',e=>{if(e.target.closest('#social-flight-form'))socialEstimate();});

function fleetOrderEditor(p){return `${cloud?.authoritative&&!cloud.pvp?.features?.cargoRetention?'<p class="notice">Der Spielserver benötigt noch die neue Game-command für Restladung im Frachter.</p>':''}<section class="panel unified-order"><h2>Flottenauftrag · ${esc(p.name)}</h2>${orderNavigation()}${state.planets.length<2?'<p>Besiedle eine zweite Welt für eigene Flottenaufträge.</p>':`<form id="fleet-order-form" data-planet="${p.id}" class="unified-order-form"><input type="hidden" name="type" value="${orderMode}"><label>Zielkolonie<select name="to">${planetOptions('',p.id)}</select></label><div class="order-columns"><section><h3>1 · Schiffe</h3>${fleetPicker(state,p,{categories:orderMode==='station'?['freighter','military','civil']:['freighter']})}</section><section><h3>2 · ${orderMode==='collect'?'Entnahme am Ziel':'Ladung'}</h3>${cargoFields()}<p class="fine">0 · +5 % des Flottenladeraums · MAX. Bei Abholen wird am Ziel geladen. MAX nutzt den freien Laderaum in der Reihenfolge Metall → Kristall → Treibstoff. Nicht abladbare Lieferung kehrt zum Start zurück. Auch dort volles Lager: Schiffe bleiben mit Restladung gebunden.</p></section></div><div class="order-summary" id="fleet-estimate" role="status">Wähle deine Flotte.</div><button type="submit">${orderMode==='collect'?'Abholflug starten':orderMode==='station'?'Flotte stationieren':'Lieferung starten'}</button></form>`}</section>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-order-mode],[data-social-link],[data-partner-target]');if(!b)return;if(b.dataset.orderMode){orderMode=b.dataset.orderMode;tab='fleet';fleetSection='orders';}else{socialMode=b.dataset.socialLink||b.dataset.mode||'deliver';socialTarget=b.dataset.partnerTarget||'';orderMode=socialMode==='support'?'support':'partner-deliver';tab='fleet';fleetSection='orders';}render();if(socialTarget){const select=document.getElementById('social-flight-form')?.elements.namedItem('to');if(select)select.value=socialTarget;socialTarget='';socialEstimate();}});
document.addEventListener('change',e=>{if(e.target.name==='stop-mode'){const row=e.target.closest('.route-stop');for(const part of row.querySelectorAll('[data-stop-section]'))part.hidden=e.target.value!=='both'&&part.dataset.stopSection!==e.target.value;fleetEstimates();}});
function selectedCapacity(form){return Object.entries(readMixedFleet(form)).reduce((n,[k,count])=>n+cargoCapacity(state,count,k),0);}
function refreshFleetControls(form){updateFleetEngineLabels();if(form.id==='pvp-attack-form')updatePvPEstimate(form);else{fleetEstimates();socialEstimate();}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fleet-adjust],[data-cargo-set],[data-cargo-percent]');if(!b||b.disabled||readOnly||cloudBlocked)return;const form=b.closest('form');if(!form)return;
 if(b.dataset.fleetAdjust){const input=b.closest('.fleet-choice').querySelector('[data-fleet-ship]');input.value=b.dataset.fleetAdjust==='all'?input.max:clampFleetCount(Number(input.value)+Number(b.dataset.fleetAdjust),Number(input.max));input.dispatchEvent(new Event('input',{bubbles:true}));return;}
 const input=b.closest('.cargo-control').querySelector('input'),cap=selectedCapacity(form),step=cargoStep(cap),value=orderValue(input.value),route=form.id==='route-form';
 let next=b.dataset.cargoPercent?Math.min(cap,(value==='max'?0:Number(value)||0)+step):b.dataset.cargoSet;
 if(next==='max'&&!route){const key=RES.find(k=>input.name.endsWith(k)),p=getPlanet(state,state.active);let room=cap;const prefix=input.name.slice(0,-key.length);for(const k of RES)if(k!==key){const other=form.elements.namedItem(prefix+k);if(other)room-=Number(other.value)||0;}next=Math.max(0,room);if(form.id==='social-flight-form'&&prefix==='cargo-'){const to=cloud?.pvp?.social?.partners.flatMap(q=>q.planets).find(q=>q.id===form.elements.namedItem('to').value),voyageFuel=to?Object.entries(readMixedFleet(form)).reduce((n,[ship,count])=>n+2*sharedFlight(state,p,to,count,ship).fuel,0):0;next=Math.min(next,Math.floor(Math.max(0,p.resources[key]-(p.reserves?.[key]||0)-(key==='fuel'?voyageFuel:0))));}else if(form.id==='fleet-order-form')next='max';}
 if(b.dataset.cargoPercent&&!route){const key=RES.find(k=>input.name.endsWith(k)),prefix=input.name.slice(0,-key.length);let used=0;for(const k of RES)if(k!==key){const other=form.elements.namedItem(prefix+k);if(other)used+=Number(other.value)||0;}next=Math.max(0,Math.min(Number(next),cap-used));}
 input.value=next;input.dispatchEvent(new Event('input',{bubbles:true}));refreshFleetControls(form);
});
document.addEventListener('input',e=>{if(!e.target.matches?.('[data-fleet-ship]'))return;e.target.value=clampFleetCount(e.target.value,Number(e.target.max));refreshFleetControls(e.target.closest('form'));});

function partnerTargetButtons(id){const partner=cloud?.pvp?.social?.partners.find(p=>p.status==='accepted'&&p.planets.some(q=>q.id===id));return !partner?'':`${partner.received.delivery?`<button data-partner-target="${esc(id)}" data-mode="deliver">Partner beliefern</button>`:''}${partner.received.defense?`<button data-partner-target="${esc(id)}" data-mode="support">Partner verteidigen</button>`:''}`;}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action="news-open"]');if(!b)return;document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.className='news-dialog';d.innerHTML='<form method="dialog"><button aria-label="Schließen">×</button></form>'+newsView()+'<p><a href="./news.html" target="_blank" rel="noopener">Öffentliche Patchnotes öffnen ↗</a></p>';document.body.append(d);d.showModal();});

function orderNavigation(){return `<div class="ship-categories">${[['deliver','Liefern'],['collect','Abholen'],['station','Stationieren'],['support','Verteidigen']].map(([k,n])=>`<button type="button" data-order-mode="${k}" aria-pressed="${orderMode===k||k==='deliver'&&orderMode==='partner-deliver'}">${n}</button>`).join('')}</div><div class="partner-shortcuts"><button type="button" data-order-mode="deliver">Eigene Kolonien</button><button type="button" data-social-link="deliver">Partner beliefern</button><button type="button" data-social-link="support">Partner verteidigen</button></div>`;}

function updateFleetEngineLabels(){if(!state)return;for(const form of document.querySelectorAll('#fleet-order-form,#social-flight-form,#pvp-attack-form,#route-form')){const from=getPlanet(state,form.dataset.planet||state.active),toId=form.querySelector('[name="to"]')?.value||form.querySelectorAll('[name="stop-planet"]')[1]?.value,to=state.planets.find(p=>p.id===toId)||cloud?.pvp?.social?.partners.flatMap(p=>p.planets).find(p=>p.id===toId)||galaxyData?.planets.find(p=>p.id===toId),remote=!!to&&(from.system||'tutorial')!==(to.system||'tutorial');for(const label of form.querySelectorAll('[data-engine-label]')){const k=label.dataset.engineLabel;try{const engine=shipFlightEngine(state,k,remote);label.textContent=TECHS[engine].name+' '+(state.tech[engine]||0)+(SHIPS[k].cargo?' · '+fmt(cargoCapacity(state,1,k))+' Laderaum':'');}catch(e){label.textContent=e.message;}}}}
document.addEventListener('change',e=>{if(e.target.closest('#fleet-order-form,#social-flight-form,#pvp-attack-form,#route-form'))updateFleetEngineLabels();});

function updateOverviewProgress(now){for(const el of document.querySelectorAll('[data-overview-start]')){const start=Number(el.dataset.overviewStart),end=Number(el.dataset.overviewEnd),percent=Math.round(Math.max(0,Math.min(100,100*(now-start)/Math.max(1,end-start))));el.setAttribute('aria-valuenow',percent);el.querySelector('i').style.width=percent+'%';}}

function fleetExternalMissions(){
 const now=gameNow(),social=cloud?.pvp?.social,flights=[];
 for(const m of cloud?.pvp?.outgoing||[]){const returning=m.status==='returning',due=returning?m.returnAt:m.arrival,start=returning?m.arrival:m.arrival-(m.returnAt-m.arrival);flights.push(fleetTravelCard({title:'Angriff',status:m.awaitingUnload?'Wartet auf Lagerplatz · Schiffe gebunden':returning?'Rückflug':'Unterwegs',worlds:(returning?[m.to,m.from]:[m.from,m.to]).map(fleetWorld),fleet:m.fleet,cargoHTML:costHTML(m.cargo||vector([0,0,0])),capacity:fleetCapacity(state,m.fleet),start,due,now,waiting:!!m.awaitingUnload,clock:m.awaitingUnload?'Restladung bleibt an Bord':duration(due-now),actions:button('Einsatz ansehen','pvp-open')}));}
 for(const m of social?.missions||[]){if(!m.own)continue;const returning=m.status==='returning',stationed=m.status==='stationed',actions=m.kind==='support'&&['outbound','stationed'].includes(m.status)?`<button data-social-op="recall" data-social-id="${esc(m.id)}" ${readOnly||galaxyBusy||cloudSaving?'disabled':''}>Zurückrufen</button>`:'';
 if(stationed){flights.push(`<article class="route-card"><div class="route-card-heading"><h3>Verteidigung bei ${esc(m.hostName)}</h3><span class="route-status">Stationiert</span></div><div class="route-path">${orb(fleetWorld(m.to),'small')} ${esc(fleetWorld(m.to).name)}</div><div class="route-ships">${Object.entries(m.fleet).filter(([,n])=>n>0).map(([k,n])=>`<span>${unitIcon(k)} ${fmt(n)} × ${esc(SHIPS[k]?.name||k)}</span>`).join('')}</div><div class="route-actions">${actions}</div></article>`);continue;}
 flights.push(fleetTravelCard({title:({delivery:'Partnerlieferung',trade:'Rohstofftausch',support:'Verteidigung'})[m.kind]||'Partnerflotte',status:m.awaitingUnload?'Wartet auf Lagerplatz · Schiffe gebunden':returning?'Rückflug':'Unterwegs',worlds:(returning?[m.to,m.from]:[m.from,m.to]).map(fleetWorld),fleet:m.fleet,cargoHTML:costHTML(m.cargo),capacity:fleetCapacity(state,m.fleet),info:'Partner: '+m.hostName,start:m.due-m.duration,due:m.due,now,waiting:!!m.awaitingUnload,clock:m.awaitingUnload?'Restladung bleibt an Bord':duration(m.due-now),actions}));}
 return flights.length?'<h3>Angriffe & Partnerflotten · '+flights.length+'</h3><div class="route-cards">'+flights.join('')+'</div>':'';
}
