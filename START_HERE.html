// Public navigation only. Planet properties and ownership are supplied by the server after surveying.
const GALAXY_SYSTEMS=[
 {id:'helion',name:'Helion',x:520,y:400},{id:'orion',name:'Orion',x:380,y:250},
 {id:'cetus',name:'Cetus',x:220,y:450},{id:'aster',name:'Aster',x:600,y:180},
 {id:'lysara',name:'Lysara',x:750,y:300},{id:'vela',name:'Vela',x:850,y:180},

function galaxyDistance(start,system,slot=1){return Math.max(1,Math.hypot(start.x-system.x,start.y-system.y)/40+slot*.15);}
function galaxyFlight(s,from,target,start,ship='longProbe'){

 const distance=galaxyDistance(origin,target,target.slot||1),level=s.tech.ramjet||0;
 return {distance,ms:Math.ceil((60+distance*25)/(1+level*.12))*1000,fuel:Math.ceil(distance*(ship==='longProbe'?6:18)/(1+level*.12))};
}
function validateGalaxy(data){
 if(!data||!Array.isArray(data.systems)||data.systems.length!==10||!Array.isArray(data.planets)||!Array.isArray(data.missions)||!data.start)throw Error('Ungültige Galaxie-Antwort.');
 const finite=n=>typeof n==='number'&&Number.isFinite(n),ids=new Set();
 for(const sys of data.systems){if(!GALAXY_SYSTEMS.some(s=>s.id===sys.id)||ids.has(sys.id)||!finite(sys.x)||!finite(sys.y)||!Number.isInteger(sys.planetCount)||sys.planetCount<3||sys.planetCount>10)throw Error('Ungültige Systemdaten.');ids.add(sys.id);}
 if(!finite(data.start.x)||!finite(data.start.y)||data.planets.length>100||data.missions.length>100)throw Error('Ungültige Galaxiedaten.');
 for(const p of data.planets){if(!ids.has(p.system)||!/^g-[a-z]+-p(?:[1-9]|10)$/.test(p.id)||!Number.isInteger(p.slot)||p.slot<1||p.slot>10||typeof p.surveyed!=='boolean')throw Error('Ungültige Planetendaten.');if(!p.surveyed&&Object.keys(p).some(k=>!['id','system','slot','surveyed'].includes(k)))throw Error('Nicht freigegebene Untersuchungsdaten.');if(p.surveyed&&(typeof p.name!=='string'||p.name.length>40||!Array.isArray(p.mult)||p.mult.length!==3||p.mult.some(n=>!finite(n)||n<0||n>10)||!['home','ferrum','nereus','thalassa'].includes(p.image)||!['mine','foreign','free'].includes(p.owner)||typeof p.reserved!=='boolean'||!finite(p.energy)||p.energy<=0))throw Error('Ungültige Untersuchungsdaten.');}
 if(!finite(data.serverNow)||data.missions.some(m=>!['scan','colony'].includes(m.kind)||typeof m.id!=='string'||typeof m.to!=='string'||!ids.has(m.system)||!finite(m.due)||!finite(m.arrival)||!finite(m.start)||m.start>m.arrival||m.arrival>m.due))throw Error('Ungültige Galaxieflüge.');
 if(data.players!==undefined){if(!Array.isArray(data.players)||data.players.length>1000)throw Error('Ungültige Spielerübersicht.');const seen=new Set();for(const p of data.players){if(typeof p.id!=='string'||!/^[a-f0-9]{32}$/.test(p.id)||seen.has(p.id)||typeof p.name!=='string'||p.name.length>30||typeof p.commander!=='string'||p.commander.length>30||!finite(p.x)||!finite(p.y)||p.x<0||p.x>1000||p.y<0||p.y>1000||typeof p.is_me!=='boolean'||Object.keys(p).some(k=>!['id','name','commander','x','y','is_me'].includes(k)))throw Error('Ungültige Spielerdaten.');seen.add(p.id);}}
 return data;
}


function planet(id,name,meta={}){
 return {id,name,coord:meta.coord||'1:1:4',kind:meta.kind||'Heimatwelt',mult:meta.mult||[1,1,1],color:meta.color||'#53add3',ocean:meta.ocean??true,energy:meta.energy||1,distance:meta.distance||0,reserves:vector([0,0,0]),resources:vector([0,0,0]),depot:vector([0,0,0]),buildings:Object.fromEntries(Object.keys(BUILDINGS).map(k=>[k,0])),ships:Object.fromEntries(Object.keys(SHIPS).map(k=>[k,0])),build:null,shipjob:null};
}
function newGame(name='Commander',now=Date.now()){
 const home=planet('home','Aurelia');
 home.resources=vector([3000,2200,1000]); Object.assign(home.buildings,{metal:1,crystal:1,fuel:1,solar:3});
 return {version:1,name:name.trim().slice(0,30)||'Commander',time:now,created:now,seq:0,active:'home',planets:[home],tech:Object.fromEntries(Object.keys(TECHS).map(k=>[k,0])),research:null,discovered:[],missions:[],reports:[]};
}
function getPlanet(s,id){const p=s.planets.find(p=>p.id===id);if(!p)throw Error('Planet nicht gefunden.');return p;}
function capacity(p){return 4000*Math.pow(1.7,p.buildings.warehouse);}
function stats(s,p){
 const supply=(p.buildings.solar*45+p.buildings.tidal*180)*(1+s.tech.energy*.1);
 const demand=(p.buildings.metal*15+p.buildings.crystal*18+p.buildings.fuel*20)*p.energy;
 const ratio=demand?Math.min(1,supply/demand):1;
 const rates=vector(RES.map((k,i)=>p.buildings[k]?([300,220,140][i]*p.buildings[k]*Math.pow(1.12,p.buildings[k]-1)*p.mult[i]*ratio):0));
 return {supply,demand,ratio,rates,cap:capacity(p)};
}
function settle(p){const cap=capacity(p);for(const k of RES){const n=Math.min(Math.max(0,cap-p.resources[k]),p.depot[k]);p.resources[k]+=n;p.depot[k]-=n;}}
function deliver(p,cargo){for(const k of RES)p.depot[k]+=cargo[k];settle(p);}
function produce(s,ms){for(const p of s.planets){settle(p);const z=stats(s,p);for(const k of RES)p.resources[k]=Math.min(z.cap,p.resources[k]+z.rates[k]*ms/3600000);}}
function report(s,title,body){s.reports.unshift({id:++s.seq,time:s.time,title,body});s.reports=s.reports.slice(0,60);}
function need(s,p,req){if(!req)return '';if(req.tech&&s.tech[req.tech]<req.level)return `Benötigt ${TECHS[req.tech].name} Stufe ${req.level}.`;if(req.building&&p.buildings[req.building]<req.level)return `Benötigt ${BUILDINGS[req.building].name} Stufe ${req.level}.`;return '';}
function buildInfo(s,p,key){const b=BUILDINGS[key];if(!b)throw Error('Unbekanntes Gebäude.');const l=p.buildings[key];return {cost:costAt(b,l),ms:Math.ceil(b.time*Math.pow(1.35,l)*Math.pow(.95,s.tech.engineering)*Math.pow(.92,p.buildings.robotics)*1000),reason:need(s,p,b.requires)||(b.ocean&&!p.ocean?'Benötigt einen Ozeanplaneten.':'')||(l>=30?'Maximale Prototyp-Stufe 30 erreicht.':'')};}
function researchInfo(s,p,key){const t=TECHS[key];if(!t)throw Error('Unbekannte Forschung.');const l=s.tech[key];return {cost:costAt(t,l),ms:Math.ceil(t.time*Math.pow(1.5,l)/Math.max(1,1+(p.buildings.lab-1)*.15)*1000),reason:(key==='colonization'&&l>=3&&l<t.max?need(s,p,{tech:['ramjet','impulse','hyperspace'][l-3],level:1}):'')||(p.buildings.lab<t.lab?`Benötigt Forschungslabor Stufe ${t.lab} auf diesem Planeten.`:need(s,p,t.requires)||(l>=t.max?'Maximale Forschungsstufe erreicht.':''))};}
function pay(p,c){settle(p);for(const k of RES)if(!Number.isFinite(c[k])||c[k]<0||p.resources[k]+1e-8<c[k])throw Error('Nicht genügend lokale Ressourcen.');for(const k of RES)p.resources[k]=Math.max(0,p.resources[k]-c[k]);settle(p);}
function shipInfo(s,p,key,count=1){const sh=SHIPS[key];if(!sh)throw Error('Unbekanntes Schiff.');return {cost:vector(sh.cost.map(v=>v*count)),ms:sh.time*count*1000,reason:p.buildings.shipyard<(sh.shipyard||1)?`Benötigt Schiffswerft Stufe ${sh.shipyard||1}.`:s.tech[sh.tech]<(sh.techLevel||1)?`Benötigt ${TECHS[sh.tech].name} Stufe ${sh.techLevel||1}.`:(s.tech[sh.engine||'drive']||0)<(sh.engineLevel||0)?`Benötigt ${TECHS[sh.engine].name} Stufe ${sh.engineLevel}.`:''};}
function cargoCapacity(s,n=1,ship='transport'){return Math.floor((SHIPS[ship]?.cargo||0)*(1+s.tech.logistics*.15))*n;}
function flightInfo(s,from,to,n=1,probe=false,ship='transport'){const def=SHIPS[probe?'probe':ship];if(!def)throw Error('Unbekanntes Schiff.');const remote=(from.system||'tutorial')!==(to.system||'tutorial');const anchor=s.galaxy||{x:500,y:960};const a=from.system?from:anchor,b=to.system?to:anchor;const dist=remote?Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)/40):Math.max(1,Math.abs((from.distance||0)-(to.distance||0)));return {ms:Math.ceil((10+dist*8)*1000/((1+(s.tech[def.engine||'drive']||0)*.12+(probe?s.tech.scout*.1:0))*def.speed)),fuel:Math.ceil(def.fuel*2*dist*n/(1+(s.tech[def.engine||'drive']||0)*.12))};}
// Fleet fuel is prepaid for a complete itinerary; cargo never includes engine fuel.
function legInfo(s,from,to,n=1,ship='transport'){const f=flightInfo(s,from,to,n,ship==='probe',ship);return {...f,fuel:Math.ceil(f.fuel/2)};}
function routeLegInfo(s,from,to,n=1,ship='transport'){const f=legInfo(s,from,to,n,ship);return {ms:Math.ceil(f.ms*ROUTE_ECONOMY.time),fuel:Math.ceil(f.fuel*ROUTE_ECONOMY.fuel)};}
function fleetManifest(m){return m.fleet||{[m.ship]:m.count};}
function checkedFleet(fleet){if(!fleet||typeof fleet!=='object'||Array.isArray(fleet)||!Object.keys(fleet).length||Object.entries(fleet).some(([k,n])=>!isFreighter(k)||!Number.isInteger(n)||n<1||n>100)||Object.values(fleet).reduce((a,b)=>a+b,0)>100)throw Error('Wähle 1–100 Frachter insgesamt.');return {...fleet};}

function mixedRouteLeg(s,from,to,fleet){let ms=0,fuel=0,slowest='';for(const [ship,count] of Object.entries(checkedFleet(fleet))){if((from.system||'tutorial')!==(to.system||'tutorial')&&!SHIPS[ship].engine)throw Error('Interstellare Routen benötigen bei allen Schiffen ein fortgeschrittenes Triebwerk.');const f=routeLegInfo(s,from,to,count,ship);if(f.ms>ms){ms=f.ms;slowest=ship;}fuel+=f.fuel;}return {ms,fuel,slowest};}
function routeInfo(s,stops,count,ship='transport'){const fleet=typeof count==='object'?checkedFleet(count):checkedFleet({[ship]:count});let fuel=0,ms=0,slowest='';for(let i=0;i<stops.length;i++){const f=mixedRouteLeg(s,getPlanet(s,stops[i].planet),getPlanet(s,stops[(i+1)%stops.length].planet),fleet);fuel+=f.fuel;ms+=f.ms;slowest=f.slowest;}return {fuel,ms,slowest,capacity:fleetCapacity(s,fleet)};}
function checkedStops(s,stops,home){if(!Array.isArray(stops)||stops.length<2||stops.length>12||stops[0].planet!==home)throw Error('Eine Route benötigt 2–12 Stopps und beginnt am Startplaneten.');for(let i=0;i<stops.length;i++){getPlanet(s,stops[i].planet);if(stops[i].planet===stops[(i+1)%stops.length].planet||!validOrder(stops[i].load)||!validOrder(stops[i].unload))throw Error('Ungültiger Stopp oder Laderegel.');}return structuredClone(stops);}
function setFleet(m,fleet){m.fleet={...fleet};[m.ship,m.count]=Object.entries(fleet)[0];}
function validOrder(order){return order&&RES.every(k=>order[k]==='max'||Number.isSafeInteger(order[k])&&order[k]>=0&&order[k]<=1e12);}
function loadCargo(s,p,cargo,order,count,ship='transport',fleet=null){settle(p);let room=(fleet?fleetCapacity(s,fleet):cargoCapacity(s,count,ship))-RES.reduce((a,k)=>a+cargo[k],0);for(const k of RES){const want=order[k]==='max'?Infinity:order[k];const amount=Math.min(room,want,Math.floor(Math.max(0,p.resources[k]+p.depot[k]-(p.reserves?.[k]||0))));cargo[k]+=amount;const local=Math.min(amount,p.resources[k]);p.resources[k]-=local;p.depot[k]-=amount-local;room-=amount;}settle(p);}
function stopCargo(s,m,stop){const p=getPlanet(s,stop.planet),out=vector(RES.map(k=>stop.unload[k]==='max'?m.cargo[k]:Math.min(m.cargo[k],stop.unload[k])));for(const k of RES)m.cargo[k]-=out[k];deliver(p,out);loadCargo(s,p,m.cargo,stop.load,m.count,m.ship,fleetManifest(m));}
function leaveRoute(s,m,index){const from=m.stops[m.index].planet,to=m.stops[index].planet,f=mixedRouteLeg(s,getPlanet(s,from),getPlanet(s,to),fleetManifest(m));m.from=from;m.to=to;m.index=index;m.start=s.time;m.duration=f.ms;m.due=s.time+f.ms;}
function parkFleet(s,m,id,title){const p=getPlanet(s,id);deliver(p,m.cargo);for(const [k,n] of Object.entries(fleetManifest(m)))p.ships[k]+=n;s.missions=s.missions.filter(x=>x.id!==m.id);report(s,title,`${Object.entries(fleetManifest(m)).map(([k,n])=>n+' × '+SHIPS[k].name).join(', ')} im Orbit von ${p.name}. Ladung wurde eingelagert.`);}
function routeArrival(s,m){
 if(m.index===0){deliver(getPlanet(s,m.home),m.cargo);m.cargo=vector([0,0,0]);m.rounds++;report(s,'Handelsrunde abgeschlossen',`${m.name}: Runde ${m.rounds} beendet.`);
  if(m.pending&&!m.stopping){const next=m.pending,p=getPlanet(s,m.home),old=fleetManifest(m);if(Object.entries(next.fleet).every(([k,n])=>p.ships[k]+(old[k]||0)>=n)){for(const [k,n] of Object.entries(old))p.ships[k]+=n;for(const [k,n] of Object.entries(next.fleet))p.ships[k]-=n;setFleet(m,next.fleet);m.name=next.name;m.stops=structuredClone(next.stops);m.repeat=next.repeat;delete m.pending;report(s,'Routenänderung aktiviert',`${m.name}: Flotte und Stopps am Startplaneten aktualisiert.`);}else report(s,'Routenänderung wartet',`${m.name}: Am Startplaneten fehlen Schiffe; bisherige Route bleibt aktiv.`);}
  if(!m.repeat||m.stopping){parkFleet(s,m,m.home,'Handelsroute beendet');return;}
  const p=getPlanet(s,m.home),f=routeInfo(s,m.stops,fleetManifest(m));
  if(p.resources.fuel-(p.reserves?.fuel||0)<f.fuel){parkFleet(s,m,m.home,'Handelsroute pausiert: Treibstoff fehlt');return;}
  pay(p,vector([0,0,f.fuel]));stopCargo(s,m,m.stops[0]);leaveRoute(s,m,1);
 }else{stopCargo(s,m,m.stops[m.index]);report(s,'Handelsstopp',`${m.name}: ${getPlanet(s,m.to).name} · Runde ${m.rounds+1}.`);leaveRoute(s,m,(m.index+1)%m.stops.length);}

function advance(s,now){
 if(!Number.isFinite(now))throw Error('Ungültige Zeit.');now=Math.max(now,s.time);
 let guard=0;
 while(true){
  const times=[];for(const p of s.planets){if(p.build)times.push(p.build.end);if(p.shipjob)times.push(p.shipjob.end);}if(s.research)times.push(s.research.end);for(const m of s.missions)times.push(m.due);
  const next=Math.min(...times);if(next>now||!Number.isFinite(next))break;if(++guard>100000){for(const m of s.missions)if(m.type==='route'&&!m.stopping){m.stopping=true;report(s,'Handelsroute endet nach langer Abwesenheit',`${m.name}: Die aktuelle Runde wird noch abgeschlossen.`);}guard=0;}
  produce(s,Math.max(0,next-s.time));s.time=Math.max(s.time,next);
  // Fixed order: research, buildings, shipbuilding, then missions by id.
  if(s.research&&s.research.end<=s.time){const j=s.research;s.tech[j.key]=j.level;s.research=null;report(s,'Forschung abgeschlossen',`${TECHS[j.key].name} erreicht Stufe ${j.level}.`);}
  for(const p of s.planets){if(p.build&&p.build.end<=s.time){const j=p.build;p.buildings[j.key]=j.level;p.build=null;report(s,'Ausbau abgeschlossen',`${p.name}: ${BUILDINGS[j.key].name}, Stufe ${j.level}.`);}if(p.shipjob&&p.shipjob.end<=s.time){const j=p.shipjob;p.ships[j.key]+=j.count;p.shipjob=null;report(s,'Schiffbau abgeschlossen',`${p.name}: ${j.count} × ${SHIPS[j.key].name}.`);}}
  for(const m of [...s.missions].sort((a,b)=>a.id-b.id))if(m.due<=s.time){
   if(m.type==='route'){routeArrival(s,m);}
   else if(m.type==='station'){parkFleet(s,m,m.to,'Flotte stationiert');}
   else if(m.type==='collect'&&m.phase==='outbound'){loadCargo(s,getPlanet(s,m.to),m.cargo,m.order,m.count,m.ship);m.phase='return';m.due=s.time+m.duration;report(s,'Material abgeholt',`${getPlanet(s,m.to).name}: Ladung auf dem Rückweg.`);}
   else if(m.phase==='return'){if(m.type==='collect')deliver(getPlanet(s,m.from),m.cargo);getPlanet(s,m.from).ships[m.ship]+=m.count;s.missions=s.missions.filter(x=>x.id!==m.id);report(s,'Flotte zurückgekehrt',`${SHIPS[m.ship].name}: ${m.count} zurück auf ${getPlanet(s,m.from).name}.`);}
   else if(m.type==='probe'){if(!s.discovered.includes(m.to))s.discovered.push(m.to);const t=TARGETS.find(t=>t.id===m.to);report(s,'Sondenbericht',`${t.name} [${t.coord}] · ${t.kind}. Metall ×${t.mult[0]}, Kristall ×${t.mult[1]}, Treibstoff ×${t.mult[2]}. Energiebedarf ×${t.energy}.`);m.phase='return';m.due=s.time+m.duration;}
   else if(m.type==='colony'){const t=TARGETS.find(t=>t.id===m.to);if(!s.planets.some(p=>p.id===t.id)){const p=planet(t.id,t.name,t);p.buildings.solar=2;deliver(p,m.cargo);s.planets.push(p);report(s,'Kolonie gegründet',`${t.name} ist besiedelt. Mitgebrachte Startmaterialien stehen dort bereit. Baue zuerst lokale Minen.`);}s.missions=s.missions.filter(x=>x.id!==m.id);}
   else {deliver(getPlanet(s,m.to),m.cargo);report(s,'Transport angekommen',`${getPlanet(s,m.from).name} → ${getPlanet(s,m.to).name}: ${RES.map(k=>`${Math.round(m.cargo[k])} ${k==='metal'?'Metall':k==='crystal'?'Kristall':'Treibstoff'}`).join(', ')}. Überschüsse bleiben im Lieferdepot.`);m.cargo=vector([0,0,0]);m.phase='return';m.due=s.time+m.duration;}

function act(s,action,now=Date.now()){

function progress(job,label){const progress=Math.min(100,Math.max(0,100*(state.time-job.start)/(job.end-job.start)));return `<div class="job"><div class="split"><strong>${esc(label)}</strong><span class="muted" data-due="${job.end}">${duration(job.end-state.time)}</span></div><div class="track"><i style="width:${progress}%"></i></div></div>`;}
function affordable(p,c){return RES.every(k=>p.resources[k]>=c[k]);}
function nextGoal(){const p=getPlanet(state,'home');if(!p.buildings.lab)return ['Forschung beginnen','Baue Forschungslabor Stufe 1.','build'];if(!state.tech.scout)return ['Den Horizont erweitern','Erforsche Sensortechnik Stufe 1.','research'];if(!p.buildings.shipyard)return ['Bereit zum Aufbruch','Baue Schiffswerft Stufe 1.','build'];if(!state.discovered.length)return ['Deine erste Entdeckung','Baue eine Sonde unter Flotten und erkunde einen Planeten.','galaxy'];if(!state.tech.colonization)return ['Eine neue Welt','Baue Labor Stufe 2 und erforsche Kolonisierung.','research'];if(state.planets.length===1)return ['Die erste Kolonie','Baue ein Kolonieschiff und besiedle dein erkundetes Ziel.','galaxy'];if(!state.tech.logistics)return ['Welten verbinden','Erforsche Transporttechnik und baue einen Frachter.','research'];if(!state.reports.some(r=>r.title==='Transport angekommen'))return ['Dein Imperium verbinden','Baue Kolonieminen aus und transportiere Material nach Aurelia.','fleet'];return ['Der Kreislauf steht','Erkunde die nächste Welt und entwickle deine Spezialisierung weiter.','galaxy'];}
function overview(p){const z=stats(state,p),goal=nextGoal();return `<section class="hero"><div class="hero-copy"><span class="eyebrow">${esc(p.kind)} · [${esc(p.coord)}]</span><h1>${esc(p.name)}</h1><p>${p.id==='home'?'Hier beginnt dein Imperium.':'Deine Wirtschaft hat eine neue Heimat.'}</p><div class="chips"><span>${state.planets.length-1} Kolonie${state.planets.length===2?'':'n'}</span><span>${Object.values(p.buildings).reduce((a,b)=>a+b,0)} Ausbaustufen</span></div></div>${orb(p)}</section><div class="two-columns"><section class="panel accent"><span class="eyebrow">DEIN NÄCHSTES ZIEL</span><h2>${goal[0]}</h2><p>${goal[1]}</p>${button('Zum nächsten Schritt →','tab',`data-tab="${goal[2]}"`)}</section><section class="panel"><h2>Lokale Produktion</h2>${RES.map(k=>`<div class="stat-row"><span>${ICON[k]} ${LABEL[k]}</span><strong>${fmt(z.rates[k])} / Std</strong></div>`).join('')}<div class="stat-row"><span>Energieversorgung</span><strong class="${z.ratio<1?'amber':'cyan'}">${Math.round(z.ratio*100)} %</strong></div><p class="fine">${z.ratio<1?'Baue Energie aus: Unterversorgung bremst alle Minen.':'Die Minen arbeiten mit voller Leistung.'}</p></section></div><section class="panel"><h2>Aktuelle Aufträge</h2>${p.build?progress(p.build,`${BUILDINGS[p.build.key].name} · Stufe ${p.build.level}`):'<p class="muted">Bauplatz frei. Wähle den nächsten Ausbau.</p>'}${state.research?progress(state.research,`${TECHS[state.research.key].name} · Stufe ${state.research.level}`):''}${p.shipjob?progress(p.shipjob,`${p.shipjob.count} × ${SHIPS[p.shipjob.key].name}`):''}</section><section><div class="section-title"><h2>Deine Welten</h2><span class="muted">Materialien sind lokal</span></div><div class="world-grid">${state.planets.map(q=>`<button class="world-card ${q.id===p.id?'selected':''}" data-action="planet" data-id="${q.id}">${orb(q,'small')}<strong>${esc(q.name)}</strong><span class="muted">${esc(q.kind)}</span></button>`).join('')}</div></section>`;}
function buildingEnergy(p,key){const next=structuredClone(p);next.buildings[key]++;const now=stats(state,p),after=stats(state,next),extra=after.demand-now.demand,gain=after.supply-now.supply,balance=after.supply-after.demand,n=v=>v.toLocaleString('de-DE',{maximumFractionDigits:2});return `<p class="fine ${balance<0?'amber':'cyan'}">ϟ ${extra>0?`Nächste Stufe benötigt +${n(extra)} Energie`:gain>0?`Nächste Stufe liefert +${n(gain)} Energie`:'Kein zusätzlicher Energiebedarf'} · ${balance<0?`Danach fehlen ${n(-balance)} Energie`:`Danach ${n(balance)} Energie frei`}</p>`;}
function buildings(p){return `<div class="page-heading"><span class="eyebrow">${esc(p.name)}</span><h1>Bauen</h1><p>Ein Bauauftrag pro Planet. Forschungen laufen parallel.</p></div>${p.build?progress(p.build,`${BUILDINGS[p.build.key].name} → Stufe ${p.build.level}`):''}<div class="list">${Object.entries(BUILDINGS).map(([key,b])=>{const inf=buildInfo(state,p,key),reason=inf.reason||(p.build?'Bauplatz belegt.':'')||(!affordable(p,inf.cost)?'Lokale Ressourcen fehlen.':'');const l=p.buildings[key];let effect=b.description;if(RES.includes(key)){const next=structuredClone(p);next.buildings[key]++;effect=`Förderung jetzt ${fmt(stats(state,p).rates[key])}/Std · nächste Stufe ${fmt(stats(state,next).rates[key])}/Std (aktuelle Energieversorgung).`;}return `<article class="panel build-row ${inf.reason?'locked':''}"><div class="item-icon">${b.icon}</div><div class="item-copy"><h2>${b.name} <span class="muted">· Stufe ${l}</span></h2><p>${effect}</p>${buildingEnergy(p,key)}<div class="cost">${costHTML(inf.cost)}<span>◷ ${duration(inf.ms)}</span></div>${reason?`<div class="requirement">${esc(reason)}</div>`:''}</div>${button(`Stufe ${l+1} bauen`,'build',`data-key="${key}"`,reason||readOnly)}</article>`;}).join('')}</div>`;}
function research(p){return `<div class="page-heading"><span class="eyebrow">IMPERIUMSWEIT · LABOR ${p.buildings.lab} AUF ${esc(p.name)}</span><h1>Forschung</h1><p>Neue Möglichkeiten für alle deine Welten. Kosten werden hier bezahlt.</p></div><section class="panel"><h2>Vom Tutorial in die Galaxie</h2><p>Kolonisierung 1–3: drei Kolonien neben der Heimatwelt. Danach folgen Verbrennung → Staustrahl → Impuls → Hyperraum. Stufe 3 des vorherigen Antriebs öffnet die nächste Triebwerksforschung.</p><p class="fine">Neue Triebwerke: Stufe 1 schaltet die passende Kriegsschiffklasse frei, Stufe 2 den passenden Frachter. Jede Stufe verbessert nur Schiffe dieses Triebwerks. Kolonisierung 4/5/6 erfordert Staustrahl/Impuls/Hyperraum 1; diese zusätzlichen Plätze sind für die gemeinsame Galaxie. Fernsonde: Sensortechnik 2 + Staustrahl 1. Interstellares Kolonieschiff: Kolonisierung 4 + Staustrahl 1.</p></section>${state.research?progress(state.research,`${TECHS[state.research.key].name} → Stufe ${state.research.level}`):''}<div class="list">${Object.entries(TECHS).map(([key,t])=>{const inf=researchInfo(state,p,key),reason=inf.reason||(state.research?'Forschungslabor beschäftigt.':'')||(!affordable(p,inf.cost)?'Lokale Ressourcen fehlen.':'');return `<article class="panel build-row ${inf.reason?'locked':''}"><div class="item-icon">⚗</div><div class="item-copy"><h2>${t.name} <span class="muted">· Stufe ${state.tech[key]} / ${t.max}</span></h2><p>${t.description}</p><div class="cost">${costHTML(inf.cost)}<span>◷ ${duration(inf.ms)}</span></div>${reason?`<div class="requirement">${esc(reason)}</div>`:''}</div>${button('Erforschen','research',`data-key="${key}"`,reason||readOnly)}</article>`;}).join('')}</div>`;}
function tutorialGalaxy(p){return `<div class="page-heading"><span class="eyebrow">AUFBRUCH VON ${esc(p.name)}</span><h1>${esc(state.systemName||'Mein Sonnensystem')}</h1><form id="system-name-form"><label>Name deines Sonnensystems<input name="systemName" maxlength="30" required value="${esc(state.systemName||'')}" placeholder="z. B. Solara"></label><button ${readOnly||cloudBlocked||galaxyBusy?'disabled':''}>Namen speichern</button></form><p class="fine">Systemname und Commander-Name sind für angemeldete Spieler auf der Galaxiekarte sichtbar.</p><p>Erkunde und besiedle Ferrum, Nereus und Thalassa. Kolonisierung 1–3 erlaubt alle drei Kolonien neben deiner Heimatwelt.</p></div><div class="system-map"><span class="sun"></span>${TARGETS.map((t,i)=>`<span class="map-planet" style="--planet:${t.color};left:${28+i*25}%;top:${40+(i%2)*14}%">${state.discovered.includes(t.id)?t.name:'?'}</span>`).join('')}</div><div class="world-grid targets">${TARGETS.map(t=>{const known=state.discovered.includes(t.id),owned=state.planets.some(p=>p.id===t.id),mission=state.missions.find(m=>m.to===t.id&&m.type==='colony'),canColony=known&&!owned&&!mission&&state.planets.length-1+state.missions.filter(m=>m.type==='colony').length<state.tech.colonization&&p.ships.colony;const f=flightInfo(state,p,t,1,true);return `<article class="panel target"><div class="target-visual">${orb({...t,buildings:{}},'medium')}</div><span class="eyebrow">[${t.coord}]</span><h2>${known?t.name:'Unbekannte Welt'}</h2><p>${known?t.kind:'Ein Signal am Rand deines Systems.'}</p>${known?`<div class="yields">${RES.map((k,i)=>`<div><span>${LABEL[k]}</span><strong>×${t.mult[i].toLocaleString('de-DE')}</strong><div class="track"><i style="width:${Math.min(100,t.mult[i]/2*100)}%"></i></div></div>`).join('')}</div><p class="fine">Energiebedarf ×${t.energy} · ${t.ocean?'Gezeitenkraftwerke möglich':'Keine Gezeitenkraftwerke'}</p>`:'<div class="unknown">Vorkommen noch nicht bekannt</div>'}<p class="fine">Sonde: ${duration(f.ms)} je Strecke · ${f.fuel} Treibstoff insgesamt</p>${button('Sonde senden','probe',`data-to="${t.id}"`,!p.ships.probe||readOnly||p.system)}${known?button(owned?'Besiedelt':mission?'Kolonieschiff unterwegs':'Kolonisieren','colony',`data-to="${t.id}"`,!canColony||readOnly||p.system):''}${known&&!owned&&!mission?'<p class="fine">Benötigt freien Kolonieplatz + Kolonieschiff. Zusätzlich mitnehmen: 350 Metall, 250 Kristall, 100 Treibstoff.</p>':''}</article>`;}).join('')}</div><section class="panel"><h2>Vorbereitung</h2><p>Verfügbare Sonden: <strong>${p.ships.probe}</strong> · Kolonieschiffe: <strong>${p.ships.colony}</strong> · Tutorial-Kolonieplätze: <strong>${state.planets.length-1} / ${Math.min(3,state.tech.colonization)}</strong> · Spätere Galaxieplätze: <strong>${Math.max(0,state.tech.colonization-3)}</strong></p>${button('Zur Schiffswerft →','tab','data-tab="fleet"')}</section>`;}
let galaxyExpanded=false;
function clearGalaxy(){galaxyExpanded=false;galaxyRequest++;galaxyData=null;galaxyError='';galaxyBusy=false;galaxyLast=0;galaxyTarget='';galaxyCamera=null;}
function galaxyMissionsHTML(){return galaxyData?.missions.length?`<h3>Galaxieflüge · ${galaxyData.missions.length}</h3>${galaxyData.missions.map(m=>`<article class="mission"><strong>${m.kind==='scan'?'Fernsonde':'Interstellares Kolonieschiff'} → ${esc(m.system)} · P${m.slot}</strong><p>${m.kind==='scan'&&m.arrival<=Date.now()?'Untersucht · Sonde auf dem Rückweg':'Unterwegs'}</p><span data-due="${m.due}">${duration(m.due-Date.now())}</span></article>`).join('')}`:'';}
function galaxy(p){
 const menu=`<div class="galaxy-menu" aria-label="Kartenbereiche">${button('Mein Sonnensystem','galaxy-section',`data-section="tutorial" aria-pressed="${galaxySection==='tutorial'}"`)}${button('Gemeinsame Galaxie','galaxy-section',`data-section="shared" aria-pressed="${galaxySection==='shared'}"`)}</div>`;
 if(galaxySection==='tutorial')return menu+tutorialGalaxy(p);
 const systems=galaxyData?.systems||GALAXY_SYSTEMS,selected=systems.find(s=>s.id===galaxySystem)||systems[0],start=galaxyData?.start;
 const planets=(galaxyData?.planets||[]).filter(q=>q.system===selected.id),target=planets.find(q=>q.id===galaxyTarget)||planets[0];
 const remote=target?{...selected,slot:target.slot}:selected,f=start?galaxyFlight(state,p,remote,start):null;
 const disabled=readOnly||cloudBlocked||galaxyBusy||!galaxyData;
 const flight=f?`<div class="trip-card"><h3>Flug ab ${esc(p.name)}</h3><div class="stat-row"><span>Fernsonde · je Strecke</span><strong>${duration(f.ms)}</strong></div><div class="stat-row"><span>Treibstoff · Hin & zurück</span><strong>${f.fuel}</strong></div><div class="stat-row"><span>Entfernung</span><strong>${f.distance.toFixed(1)} AE</strong></div></div>`:'<p class="fine">Persönliche Entfernung und Flugwerte werden nach der Anmeldung geladen.</p>';
 const scanPending=target&&galaxyData?.missions.some(m=>m.kind==='scan'&&m.to===target.id);
 const galaxySlots=Math.max(0,state.tech.colonization-3),used=galaxyData?.planets.filter(q=>q.owner==='mine').length||0;
 const colonyFlight=f&&galaxyFlight(state,p,remote,start,'starColony');
 return menu+`<div class="page-heading"><span class="eyebrow">GEMEINSAMER RAUM · 10 SYSTEME</span><h1>Galaxiekarte</h1><p>Dein Tutorial bleibt privat. Erkunde neue Welten mit Fernsonden und gründe Kolonien im gemeinsamen Raum.</p></div>${galaxyError?`<div class="notice">${esc(galaxyError)}</div>`:''}${!cloud?.user?'<div class="notice">Melde dich an, um deinen persönlichen Startplatz und die gemeinsame Galaxie zu laden.</div>':''}<div class="galaxy-toolbar"><label>System<select id="galaxy-system-picker">${systems.map(s=>`<option value="${s.id}" ${selected.id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>${button(galaxyBusy?'Wird geladen …':'Galaxie aktualisieren','galaxy-refresh','',galaxyBusy||!cloud?.user)}</div><div class="galaxy-layout"><section class="panel galaxy-map-panel ${galaxyExpanded?'galaxy-expanded':''}" aria-label="Galaxiekarte"><div class="map-viewport" id="galaxy-map" tabindex="0" aria-label="Galaxiekarte: Pfeiltasten verschieben, Plus und Minus zoomen"><div class="map-world">${start?`<button class="galaxy-node tutorial" data-action="galaxy-home" style="left:${start.x}px;top:${start.y}px"><i></i><span class="galaxy-player-label"><strong>${esc(state.systemName||'Mein Sonnensystem')}</strong><small>Dein privates Sonnensystem</small></span></button>`:''}${(galaxyData?.players||[]).filter(q=>!q.is_me).map(q=>`<button class="galaxy-node visited player-marker" aria-label="${esc(q.name)} · ${esc(q.commander)}" title="${esc(q.name)} · ${esc(q.commander)}" data-action="galaxy-player" data-player="${q.id}" style="left:${q.x}px;top:${q.y}px"><i></i><span class="galaxy-player-label"><strong>${esc(q.name)}</strong><small>${esc(q.commander)}</small></span></button>`).join('')}${systems.map(s=>{const known=galaxyData?.planets.some(q=>q.system===s.id&&q.surveyed);return `<button class="galaxy-node ${s.id===selected.id?'selected':''} ${known?'visited':''}" data-action="galaxy-system" data-system="${s.id}" aria-pressed="${s.id===selected.id}" style="left:${s.x}px;top:${s.y}px"><i></i><strong>${esc(s.name)}</strong><small>${s.planetCount?s.planetCount:'3–10'} · ${known?'Untersucht':'Unbesucht'}</small></button>`;}).join('')}</div></div><div class="map-controls">${button(galaxyExpanded?'Großansicht schließen':'Großansicht','galaxy-expand','id="galaxy-expand"')}<button data-map-zoom="out" aria-label="Karte verkleinern">−</button><span id="map-zoom">100 %</span><button data-map-zoom="in" aria-label="Karte vergrößern">+</button><button data-map-zoom="fit">Zentrieren</button></div></section><section class="panel galaxy-detail"><span class="eyebrow">${esc(selected.name)} · ${planets.length||'3–10'} Planeten</span><h2>${target?`P${target.slot} · ${esc(target.surveyed?target.name:'Unbekannt')}`:'System auswählen'}</h2>${target?target.surveyed?`<div class="galaxy-portrait">${orb({...target,buildings:{}},'small')}</div><p>${esc(target.kind)}</p><div class="yields">${RES.map((k,i)=>`<div><span>${LABEL[k]}</span><strong>×${target.mult[i]}</strong></div>`).join('')}</div><p>Energiebedarf ×${target.energy}</p><p>${target.owner==='mine'?target.reserved?'Dein Kolonieschiff unterwegs':'Deine Kolonie':target.owner==='foreign'?`Besiedelt durch ${esc(target.commander||'Commander')}${target.reserved?' · reserviert':''}`:'Unbesiedelt'}</p>`:'<div class="unknown">?</div><p>Planetentyp, Vorkommen und Besitz sind unbekannt. Eine Fernsonde liefert den Bericht erst bei Ankunft.</p>':'<p>Die Übersicht zeigt öffentliche Systempositionen. Planetendaten werden vom Server geladen.</p>'}${flight}<p class="fine">Fernsonden: ${p.ships.longProbe} · Benötigt Staustrahltriebwerke 1 und Sensortechnik 2.</p>${button(scanPending?'Fernsonde unterwegs':'Fernsonde senden','galaxy-scan',`data-target="${target?.id||''}"`,disabled||!target||scanPending||p.ships.longProbe<1||state.tech.ramjet<1)}${target?.owner==='mine'&&!target.reserved?button('Kolonie öffnen','planet',`data-id="${target.id}"`,!state.planets.some(q=>q.id===target.id)||galaxyBusy):''}${target?.surveyed&&target.owner==='free'?`<p class="fine">Kolonieschiff: ${colonyFlight?duration(colonyFlight.ms)+' · '+colonyFlight.fuel+' Treibstoff':''}. Startmaterial: 350 Metall, 250 Kristall, 100 Treibstoff.</p>${button('Interstellar kolonisieren','galaxy-colony',`data-target="${target.id}"`,disabled||p.ships.starColony<1||used>=galaxySlots)}`:''}<p class="fine">Galaxieplätze: ${used} / ${galaxySlots}. Kolonisierung 4–6 eröffnet zusätzliche Plätze neben den drei Tutorial-Kolonien.</p></section></div>${planets.length?`<section class="panel"><h2>${esc(selected.name)}-System</h2><div class="system-orbits"><img class="central-star" src="./assets/galaxy/star.webp" alt="Zentralstern"><svg viewBox="0 0 1000 360" preserveAspectRatio="none" aria-hidden="true">${planets.map((q,i)=>`<ellipse cx="500" cy="180" rx="${70+i*38}" ry="${35+i*13}"/>`).join('')}</svg>${planets.map((q,i)=>{const angle=(i*137.5+40)*Math.PI/180,x=500+(70+i*38)*Math.cos(angle),y=180+(35+i*13)*Math.sin(angle);return `<button class="orbit-target ${target?.id===q.id?'selected':''}" data-action="galaxy-target" data-target="${q.id}" style="left:${x/10}%;top:${y/3.6}%" aria-label="P${q.slot}: ${esc(q.surveyed?q.name:'Unbekannt')}">${q.surveyed?`<img src="./assets/${q.image}.webp" alt="">`:'<span>?</span>'}<small>P${q.slot}</small></button>`;}).join('')}</div><div class="galaxy-planet-list">${planets.map(q=>`<button data-action="galaxy-target" data-target="${q.id}" aria-pressed="${q.id===target?.id}"><strong>P${q.slot} · ${esc(q.surveyed?q.name:'Unbekannt')}</strong><small>${q.surveyed?q.owner==='mine'?'Eigene Kolonie':q.owner==='foreign'?'Fremde Kolonie':'Unbesiedelt':'Nicht untersucht'}</small></button>`).join('')}</div></section>`:''}${galaxyData?.players?`<section class="panel"><h2>Spieler-Sonnensysteme · ${galaxyData.players.length}</h2><p class="fine">Private Sonnensysteme sind sichtbar, aber für andere Spieler nicht anfliegbar. Dies ist keine Online-Anzeige.</p><div class="galaxy-planet-list">${galaxyData.players.map(q=>button(`${esc(q.name)} · ${esc(q.commander)}${q.is_me?' · Du':''}`,'galaxy-player',`data-player="${q.id}"`)).join('')}</div></section>`:''}${galaxyMissionsHTML()}`;
}
const galaxyMessages={RAMJET_REQUIRED:'Staustrahltriebwerke Stufe 1 fehlen.',SHIP_REQUIRED:'Das passende Schiff fehlt auf dem Startplaneten.',SURVEY_REQUIRED:'Untersuche den Planeten zuerst mit einer Fernsonde.',PLANET_TAKEN:'Dieser Planet wurde inzwischen besiedelt oder reserviert.',COLONY_LIMIT:'Erforsche eine weitere Kolonisierungsstufe für Galaxieplätze.',RESOURCES_REQUIRED:'Lokale Ressourcen reichen nicht für Flug und Startmaterial.',SCAN_UNDERWAY:'Zu diesem Planeten ist bereits eine Fernsonde unterwegs.',GALAXY_COLONIES_REQUIRED:'Diese Sicherung enthält nicht alle deine gemeinsamen Kolonien. Lade den aktuellen Cloud-Spielstand.'};
function galaxyFailure(e){if(e instanceof CloudConflict){cloudBlocked=true;cloudMessage='⚠ Anderes Gerät gespeichert · Cloud neu laden';}const raw=e.message||'Galaxie nicht erreichbar.';return Object.entries(galaxyMessages).find(([key])=>raw.includes(key))?.[1]||raw;}
function adoptGalaxy(result){state=advance(result.state,Date.now());galaxyData=result.galaxy;cloudDirty=false;cloudLastSave=Date.now();cloudMessage='● Galaxie und Cloud abgeglichen';saveGame(state,localStorage,saveKey());localStorage.setItem(saveKey()+'-cloud-meta',JSON.stringify({revision:cloud.revision,pending:false}));}
async function refreshGalaxy(force=false){if(!cloud?.user||!state||cloudBlocked||galaxyBusy||cloudSaving||readOnly||(!force&&Date.now()-galaxyLast<15000))return;const id=cloud.user.id,request=++galaxyRequest;galaxyBusy=true;galaxyError='';try{const data=await cloud.galaxyView();if(request!==galaxyRequest||id!==cloud?.user?.id)return;galaxyData=data;if(!state.galaxy||data.missions.some(m=>m.due<=data.serverNow)){if(!await flushCloud())return;const result=await cloud.galaxySync();if(request!==galaxyRequest||id!==cloud?.user?.id)return;adoptGalaxy(result);}galaxyLast=Date.now();}catch(e){if(request===galaxyRequest)galaxyError=galaxyFailure(e);}finally{if(request===galaxyRequest){galaxyBusy=false;if(tab==='galaxy'||tab==='fleet')render();}}}
async function launchGalaxy(kind,target){if(readOnly||cloudBlocked||galaxyBusy||cloudSaving||!cloud?.user)return;const id=cloud.user.id,request=++galaxyRequest;galaxyBusy=true;galaxyError='';render();try{if(!await flushCloud())return;const result=await cloud.galaxySync({kind,from:state.active,to:target});if(request!==galaxyRequest||id!==cloud?.user?.id)return;adoptGalaxy(result);toast(kind==='scan'?'Fernsonde gestartet.':'Kolonieschiff gestartet; Planet reserviert.');}catch(e){if(request===galaxyRequest){galaxyError=galaxyFailure(e);toast(galaxyError);}}finally{if(request===galaxyRequest){galaxyBusy=false;render();}}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case 'galaxy-expand':galaxyExpanded=!galaxyExpanded;galaxyCamera=null;render();document.getElementById('galaxy-expand')?.focus();break;case 'galaxy-section':galaxyExpanded=false;galaxySection=b.dataset.section;render();void refreshGalaxy();break;case 'galaxy-system':galaxyExpanded=false;galaxyCamera=null;galaxySystem=b.dataset.system;galaxyTarget='';render();break;case 'galaxy-target':galaxyTarget=b.dataset.target;render();break;case 'galaxy-player':{const q=galaxyData?.players?.find(q=>q.id===b.dataset.player);if(q){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.innerHTML=`<form method="dialog"><button aria-label="Schließen">×</button></form><h2>${esc(q.name)}</h2><p>Commander: ${esc(q.commander)}${q.is_me?' · Du':''}</p><p>Privates Sonnensystem. Planeten und Spielstand sind geschützt; andere Spieler können hier nicht hinfliegen.</p>`;document.body.append(d);d.showModal();}break;}case 'galaxy-home':document.querySelector('dialog')?.remove();galaxyExpanded=false;galaxyCamera=null;galaxySection='tutorial';render();break;case 'galaxy-refresh':void refreshGalaxy(true);break;case 'galaxy-scan':void launchGalaxy('scan',b.dataset.target);break;case 'galaxy-colony':void launchGalaxy('colony',b.dataset.target);break;}});
app.addEventListener('change',e=>{if(e.target.id==='galaxy-system-picker'){galaxySystem=e.target.value;galaxyTarget='';render();}});
setInterval(()=>{if(state&&cloud?.user&&!document.hidden)void refreshGalaxy();},15000);
function mountMap(){
 const viewport=document.getElementById('galaxy-map');if(!viewport)return null;const world=viewport.querySelector('.map-world');let zoom=galaxyCamera?.zoom||1,base=1,x=galaxyCamera?.x||0,y=galaxyCamera?.y||0,moved=false;const pointers=new Map();
 const apply=()=>{world.style.transform=`translate(${x}px,${y}px) scale(${base*zoom})`;world.style.setProperty('--marker-scale',1/(base*zoom));document.getElementById('map-zoom').textContent=`${Math.round(zoom*100)} %`;galaxyCamera={zoom,x,y};};
 const fit=()=>{zoom=1;base=Math.min(viewport.clientWidth/1000,viewport.clientHeight/1000)*.94;x=(viewport.clientWidth-1000*base)/2;y=(viewport.clientHeight-1000*base)/2;apply();};
 const zoomAt=(value,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2)=>{value=Math.max(.65,Math.min(4,value));const ratio=value/zoom;x=cx-(cx-x)*ratio;y=cy-(cy-y)*ratio;zoom=value;apply();};
 viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoomAt(zoom*Math.exp(-e.deltaY*.001),e.clientX-r.left,e.clientY-r.top);},{passive:false});
 viewport.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;});
 viewport.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;const other=[...pointers.entries()].find(([id])=>id!==e.pointerId);if(other){const q=other[1],before=Math.hypot(old.x-q.x,old.y-q.y),after=Math.hypot(e.clientX-q.x,e.clientY-q.y),r=viewport.getBoundingClientRect();if(before>0)zoomAt(zoom*after/before,(e.clientX+q.x)/2-r.left,(e.clientY+q.y)/2-r.top);}else{x+=e.clientX-old.x;y+=e.clientY-old.y;}if(Math.hypot(e.clientX-old.x,e.clientY-old.y)>2){moved=true;viewport.setPointerCapture(e.pointerId);}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});apply();});
 const end=e=>{pointers.delete(e.pointerId);setTimeout(()=>moved=false,0);};viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);viewport.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();}},true);
 viewport.addEventListener('keydown',e=>{const shift={ArrowLeft:[40,0],ArrowRight:[-40,0],ArrowUp:[0,40],ArrowDown:[0,-40]}[e.key];if(shift){e.preventDefault();x+=shift[0];y+=shift[1];apply();}else if(e.key==='+'||e.key==='=')zoomAt(zoom*1.2);else if(e.key==='-')zoomAt(zoom/1.2);});
 viewport.parentElement.querySelectorAll('[data-map-zoom]').forEach(b=>b.addEventListener('click',()=>b.dataset.mapZoom==='fit'?fit():zoomAt(zoom*(b.dataset.mapZoom==='in'?1.2:1/1.2))));
 const saved=galaxyCamera,observer=new ResizeObserver(()=>{if(viewport.clientWidth!==width||viewport.clientHeight!==height){width=viewport.clientWidth;height=viewport.clientHeight;fit();}});let width=viewport.clientWidth,height=viewport.clientHeight;observer.observe(viewport);base=Math.min(viewport.clientWidth/1000,viewport.clientHeight/1000)*.94;if(saved){x=saved.x;y=saved.y;zoom=saved.zoom;apply();}else fit();return ()=>observer.disconnect();
}

function shipOptions(p,freightersOnly=false){return ['freighter','military','civil'].map(category=>`<optgroup label="${{freighter:'Frachter',military:'Kriegsschiffe',civil:'Sonden & Kolonie'}[category]}">${Object.entries(SHIPS).filter(([key,sh])=>sh.category===category&&(!freightersOnly||isFreighter(key))).map(([key,sh])=>`<option value="${key}" ${key==='transport'?'selected':''}>${esc(sh.name)} · ${p.ships[key]} verfügbar</option>`).join('')}</optgroup>`).join('');}
function shipyardView(p){return `<div class="page-heading"><span class="eyebrow">WERFT AUF ${esc(p.name)} · STUFE ${p.buildings.shipyard}</span><h1>Flotten & Logistik</h1><p>Baue Schiffe hier, stationiere sie auf anderen Welten und verbinde deine Wirtschaft.</p></div><div class="shipyard-controls"><div class="ship-categories" aria-label="Schiffskategorien">${Object.entries({freighter:'Frachter',military:'Kriegsschiffe',civil:'Sonden & Kolonie'}).map(([key,label])=>button(label,'ship-category',`data-category="${key}" aria-pressed="${shipCategory===key}"`)).join('')}</div><p class="fine">${shipCategory==='military'?'Kriegsschiffe sind baubar und stationierbar. Angriffe, Gefechte und aktive Verteidigung folgen mit dem Kampfsystem.':shipCategory==='freighter'?'Kleine Frachter sind schnell, große Frachter transportieren mehr Material pro verbrauchtem Treibstoff.':'Sonden und Kolonieschiffe für dein Tutorial; Fernsonden und interstellare Kolonieschiffe für die gemeinsame Galaxie.'}</p></div><div class="world-grid ships">${Object.entries(SHIPS).filter(([,sh])=>sh.category===shipCategory).map(([key,sh])=>{const info=shipInfo(state,p,key),reason=info.reason||(p.shipjob?'Werft beschäftigt.':'')||(!affordable(p,info.cost)?'Lokale Ressourcen fehlen.':'');return `<article class="panel ship-card"><div class="ship-icon ship-visual"><img src="./assets/${sh.image||key}.webp" alt="${esc(sh.name)}" width="768" height="768" loading="lazy" decoding="async"></div><span class="eyebrow">${sh.tier?'TIER '+sh.tier:'BEWÄHRTES SCHIFF'}</span><h2>${sh.name}</h2><p>${sh.role}</p><p>Im Orbit: <strong>${p.ships[key]}</strong>${isFreighter(key)?` · ${fmt(cargoCapacity(state,1,key))} Laderaum`:''}</p><p class="fine">Tempo ×${sh.speed.toLocaleString('de-DE')} · ${sh.fuel} Treibstoff / Entfernungseinheit / Schiff vor Forschung</p><div class="cost">${costHTML(info.cost)}<span>◷ ${duration(info.ms)} / Schiff</span></div><p class="fine">Werft ${sh.shipyard||1} · ${TECHS[sh.tech].name} ${sh.techLevel||1} · ${TECHS[sh.engine||'drive'].name} ${sh.engineLevel||0}</p>${reason?`<p class="requirement">${esc(reason)}</p>`:''}<label class="ship-build-count">Anzahl<input id="build-count-${key}" type="number" min="1" max="50" step="1" value="1" aria-label="Anzahl ${sh.name}"></label>${button('Bauen','ship',`data-key="${key}"`,reason||readOnly)}</article>`;}).join('')}</div>${p.shipjob?progress(p.shipjob,`${p.shipjob.count} × ${SHIPS[p.shipjob.key].name}`):''}`;}
function fleetReports(){return `<section class="panel"><h2>Berichte</h2>${state.reports.length?state.reports.slice(0,20).map(r=>`<article class="report"><div class="split"><strong>${esc(r.title)}</strong><time>${new Date(r.time).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</time></div><p>${esc(r.body)}</p></article>`).join(''):'<p class="muted">Deine Entdeckungen und Lieferungen erscheinen hier.</p>'}</section>`;}
function fleetOrderFields(prefix='',values=null){return RES.map(k=>`<label>${LABEL[k]}<input name="${prefix}${k}" value="${values?.[k]??0}" inputmode="numeric" pattern="[0-9]+|[mM][aA][xX]" required aria-label="${prefix}${LABEL[k]}: Menge oder max"><small>Ganze Menge oder max</small></label>`).join('');}
function planetOptions(selected,exclude=''){return state.planets.filter(q=>q.id!==exclude).map(q=>`<option value="${q.id}" ${q.id===selected?'selected':''}>${esc(q.name)}</option>`).join('');}
function amountControl(name,value,label,allowMax=true){return `<div class="amount-control"><div class="amount-stepper"><input name="${name}" value="${value}" inputmode="numeric" pattern="${allowMax?'[0-9]+|[mM][aA][xX]':'[0-9]+'}" required aria-label="${esc(label)}"></div>${allowMax?`<div class="amount-shortcuts"><button type="button" data-action="amount-set" data-value="0">0</button><button type="button" data-action="amount-step" data-delta="100">+100</button><button type="button" data-action="amount-step" data-delta="500">+500</button><button type="button" data-action="amount-set" data-value="max">MAX</button></div>`:''}</div>`;}
function routeStopRow(id,first=false,stop=null){const q=getPlanet(state,id),load=stop?.load||vector([0,0,0]),unload=stop?.unload||(first?vector([0,0,0]):{metal:'max',crystal:'max',fuel:'max'});return `<fieldset class="route-stop"><legend>${first?'Startplanet':'Stopp'}</legend><details open><summary>${orb(q,'small')}<strong>${esc(q.name)}</strong><span>Bearbeiten</span></summary><div class="stop-content"><label>Planet<select name="stop-planet" ${first?'disabled':''}>${planetOptions(id)}</select></label>${first?'':`<div class="stop-tools"><button type="button" data-action="move-stop" data-dir="-1" aria-label="Stopp nach vorne">←</button><button type="button" data-action="move-stop" data-dir="1" aria-label="Stopp nach hinten">→</button><button type="button" data-action="remove-stop">Entfernen</button></div>`}<div class="stop-matrix"><div class="matrix-head">Rohstoff</div><div class="matrix-head">↓ Abladen</div><div class="matrix-head">↑ Einladen</div>${RES.map(k=>`<label class="resource-name">${ICON[k]} ${LABEL[k]}<small>Bestand: <span data-stock="${k}">${fmt(q.resources[k]+q.depot[k])}</span></small></label>${amountControl('unload-'+k,unload[k],LABEL[k]+' abladen')}${amountControl('load-'+k,load[k],LABEL[k]+' einladen')}`).join('')}</div></div></details></fieldset>`;}
function manifestText(m){return Object.entries(fleetManifest(m)).map(([k,n])=>`${n} × ${SHIPS[k].name}`).join(' + ');}
function readMixedFleet(form){return Object.fromEntries([...form.querySelectorAll('[data-fleet-ship]')].map(el=>[el.dataset.fleetShip,Number(el.value)]).filter(([,n])=>n!==0));}
function routeSubmenu(){return `<div class="route-submenu" role="tablist" aria-label="Handelsrouten-Menü">${[['existing','≡ Bestehende Routen'],['new','+ Neue Route']].map(([key,label])=>`<button type="button" role="tab" id="route-tab-${key}" aria-controls="route-content" aria-selected="${routeSection===key}" tabindex="${routeSection===key?0:-1}" data-action="route-${key}">${label}</button>`).join('')}</div>`;}
function routeMatches(m){const status=m.stopping?'ending':m.to===m.home?'return':'outbound';const words=[m.name,manifestText(m),...m.stops.map(q=>getPlanet(state,q.planet).name)].join(' ').toLocaleLowerCase('de-DE');return words.includes(routeQuery.toLocaleLowerCase('de-DE').trim())&&(routeFilter==='all'||routeFilter===status||routeFilter==='pending'&&!!m.pending);}
function routeCard(m){const fleet=fleetManifest(m),returning=m.to===m.home,status=m.stopping?'Endet nach dieser Runde':returning?'Rückkehr':'Unterwegs',percent=Math.round(Math.min(100,Math.max(0,100*(state.time-m.start)/m.duration)));return `<article class="trade-route route-card" data-route-card="${m.id}" ${routeMatches(m)?'':'hidden'}><div class="route-card-heading"><h3>${esc(m.name)}</h3><span class="route-status ${m.stopping?'ending':returning?'returning':''}">${status}</span><span class="route-round">Runde ${m.rounds+1} · ${m.repeat?'Endlos':'Eine Runde'}</span></div><div class="route-path" aria-label="Flugreihenfolge">${[...m.stops.map(q=>q.planet),m.home].map((id,i)=>`${i?'<span class="route-arrow" aria-hidden="true">→</span>':''}<div class="route-world">${orb(getPlanet(state,id),'small')}<span>${esc(getPlanet(state,id).name)}</span></div>`).join('')}</div><div class="route-freight"><div class="route-ships">${Object.entries(fleet).map(([k,n])=>`<span><img src="./assets/${SHIPS[k].image||k}.webp" alt=""><strong>${n} × ${esc(SHIPS[k].name)}</strong></span>`).join('')}</div><div class="route-cargo-metrics"><div><strong>${fmt(fleetCapacity(state,fleet))}</strong><small>Laderaum</small></div><div><strong>${costHTML(m.cargo)||'Leer'}</strong><small>Aktuelle Fracht</small></div></div></div><div class="route-travel"><div class="route-next">Nächster Stopp: <strong>${esc(getPlanet(state,m.to).name)}</strong></div><div class="route-flight-progress" role="progressbar" aria-label="Fortschritt zur nächsten Welt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" data-route-progress="${m.id}"><i style="width:${percent}%"></i></div><div class="route-arrival">Ankunft in <strong data-due="${m.due}">${duration(m.due-state.time)}</strong></div><div class="route-actions">${button('✎ Bearbeiten','route-edit',`data-id="${m.id}" aria-label="Route ${esc(m.name)} bearbeiten"`,m.stopping||readOnly)}${button(m.stopping?'Beendigung vorgemerkt':'Beenden','stop-route',`data-id="${m.id}" aria-label="Route ${esc(m.name)} beenden"`,m.stopping||readOnly)}</div></div>${m.pending?`<div class="route-pending"><span>◷ Änderung vorgemerkt · bei Rückkehr nach ${esc(getPlanet(state,m.home).name)}</span>${button('Verwerfen','cancel-route-edit',`data-id="${m.id}" aria-label="Vormerkung für ${esc(m.name)} verwerfen"`,readOnly)}</div>`:''}</article>`;}
function routeOverview(routes){return `<section class="route-dashboard"><div class="route-dashboard-heading"><div><h2>Deine Handelsrouten <span class="route-total">${routes.length}</span></h2><p class="fine">Sparflug: +25 % Flugzeit · −25 % Treibstoff je Strecke.</p></div><div class="route-filters"><label class="route-search">Route suchen<input id="route-search" type="search" value="${esc(routeQuery)}" placeholder="Name, Planet oder Schiff …"></label><label>Status<select id="route-filter">${[['all','Alle Routen'],['outbound','Unterwegs'],['return','Rückkehr'],['pending','Änderung vorgemerkt'],['ending','Wird beendet']].map(([key,label])=>`<option value="${key}" ${routeFilter===key?'selected':''}>${label}</option>`).join('')}</select></label></div></div><div class="route-cards">${routes.map(routeCard).join('')}</div><div id="route-no-results" class="panel route-empty" ${routes.some(routeMatches)?'hidden':''}><h3>${routes.length?'Keine passende Route':'Noch keine Handelsrouten'}</h3><p>${routes.length?'Ändere die Suche oder den Statusfilter.':'Verbinde deine Welten mit einer regelmäßigen Versorgung.'}</p>${routes.length?'':button('+ Erste Route erstellen','route-new')}</div></section>`;}
function filterRouteCards(){const routes=state.missions.filter(m=>m.type==='route');for(const el of document.querySelectorAll('[data-route-card]')){const m=routes.find(m=>m.id===Number(el.dataset.routeCard));el.hidden=!m||!routeMatches(m);}const empty=document.getElementById('route-no-results');if(empty)empty.hidden=routes.some(routeMatches);}
function tradeRoutes(p){const routes=state.missions.filter(m=>m.type==='route'),editing=routeSection==='existing'?routes.find(m=>m.id===routeEditId):null,model=editing?.pending||editing,home=editing?getPlanet(state,editing.home):p,old=editing?fleetManifest(editing):{},fleet=model?(model.fleet||fleetManifest(model)):{},stops=model?.stops||[{planet:home.id,load:vector([0,0,0]),unload:vector([0,0,0])},{planet:state.planets.find(q=>q.id!==home.id)?.id,load:vector([0,0,0]),unload:{metal:'max',crystal:'max',fuel:'max'}}];return `${routeSubmenu()}<div id="route-content" role="tabpanel" aria-labelledby="route-tab-${routeSection}">${routeSection==='existing'&&!editing?routeOverview(routes):`<section class="panel trade-editor"><div class="split"><h2>${editing?'Route bearbeiten · '+esc(editing.name):'Neue Handelsroute'}</h2>${button('← Zur Routenübersicht','route-existing')}</div>${state.planets.length<2?'<p>Besiedle eine zweite Welt, um Handelsrouten anzulegen.</p>':`<form id="route-form" data-planet="${home.id}" data-route-id="${editing?.id||0}"><div class="form-grid"><label>Routenname<input name="name" maxlength="40" required value="${esc(model?.name||'Handelsroute')}"></label><label>Betrieb<select name="repeat"><option value="true" ${model?.repeat===false?'':'selected'}>Endlos wiederholen</option><option value="false" ${model?.repeat===false?'selected':''}>Eine Runde</option></select></label></div><details class="mixed-fleet-picker" open><summary>Flotte zusammenstellen · Startplanet ${esc(home.name)}</summary><p class="fine">Vorgemerkte Schiffe bleiben bis zum Wechsel für andere Aufträge verfügbar.</p><div class="mixed-fleet-list">${Object.entries(SHIPS).filter(([k])=>isFreighter(k)).map(([k,sh])=>{const available=home.ships[k]+(old[k]||0);return `<div class="mixed-ship"><img src="./assets/${sh.image||k}.webp" alt="${esc(sh.name)}"><div><strong>${esc(sh.name)}</strong><small>${home.ships[k]} im Orbit${old[k]?` + ${old[k]} in dieser Route`:''} · ${fmt(cargoCapacity(state,1,k))} Laderaum / Schiff</small></div><div class="amount-control"><div class="amount-stepper"><button type="button" data-action="amount-step" data-delta="-1" aria-label="${sh.name} verringern">−</button><input name="fleet-${k}" data-fleet-ship="${k}" type="number" min="0" max="100" step="1" value="${fleet[k]||0}" aria-label="Anzahl ${sh.name}"><button type="button" data-action="amount-step" data-delta="1" aria-label="${sh.name} erhöhen">+</button></div><button type="button" class="all-ships" data-action="amount-set" data-value="${Math.min(100,available)}">Alle verfügbaren</button></div></div>`;}).join('')}</div></details><div class="route-estimate" id="route-estimate" role="status"></div><h3>Stopps in Flugreihenfolge</h3><p class="fine">Erst abladen, dann einladen. Nach dem letzten Stopp kehrt die Flotte zum Startplanet zurück und lädt vollständig ab.</p><div id="route-stops" class="route-stops">${stops.map((q,i)=>routeStopRow(q.planet,i===0,q)).join('')}</div><button type="button" data-action="add-stop">+ Stopp hinzufügen</button><p class="fine">+100 und +500 addieren bei jedem Klick. Nach MAX beginnt eine feste Menge wieder bei 0. MAX bleibt dynamisch: verfügbare Menge bis zum freien Laderaum. Ladereihenfolge: Metall → Kristall → Treibstoff. Bestände sind aktuelle Vorschauen, geladen wird bei Ankunft.</p>${editing?'<div class="pending-change">Änderungen werden gemeinsam bei Rückkehr zum Startplanet aktiviert. Fehlen Schiffe, bleibt die bisherige Route aktiv und die Änderung vorgemerkt.</div>':''}<div class="trade-save"><button type="submit" ${readOnly?'disabled':''}>${editing?'Änderungen vormerken':'Handelsroute starten'}</button>${editing?button('Zur Routenübersicht','route-existing'):''}</div></form>`}</section>`}</div>`;}
function fleetMissions(missions){return missions.map(m=>`<article class="mission"><div class="split"><strong>${esc(m.type==='route'?m.name:({station:'Stationieren',collect:'Abholen',deliver:'Liefern',transport:'Liefern',probe:'Erkundung',colony:'Kolonisierung'}[m.type]))} · ${esc(manifestText(m))}</strong><span data-due="${m.due}">${duration(m.due-state.time)}</span></div><p>${esc(getPlanet(state,m.from).name)} ${m.phase==='return'?'←':'→'} ${esc((state.planets.find(q=>q.id===m.to)||TARGETS.find(q=>q.id===m.to)).name)}${m.type==='route'?` · Runde ${m.rounds+1}`:''}</p><div class="cost">${costHTML(m.cargo)}</div>${m.type==='route'?`<p class="fine">${m.stops.map(q=>esc(getPlanet(state,q.planet).name)).join(' → ')} → ${esc(getPlanet(state,m.home).name)}</p>${button(m.stopping?'Endet nach dieser Runde':'Route nach dieser Runde beenden','stop-route',`data-id="${m.id}"`,m.stopping||readOnly)}`:''}</article>`).join('')||'<p class="muted">Keine Flotten unterwegs.</p>'; }
function fleetMenu(){return `<div class="fleet-menu" role="tablist" aria-label="Flottenbereiche">${Object.entries(fleetSections).map(([key,[icon,label,description]])=>`<button type="button" role="tab" id="fleet-tab-${key}" aria-controls="fleet-pane-${key}" aria-selected="${fleetSection===key}" tabindex="${fleetSection===key?0:-1}" data-action="fleet-section" data-section="${key}"><span class="fleet-menu-icon" aria-hidden="true">${icon}</span><span><strong>${label}</strong><small>${description}</small></span>${key==='routes'&&state.missions.some(m=>m.type==='route')?`<span class="fleet-menu-count">${state.missions.filter(m=>m.type==='route').length}</span>`:''}</button>`).join('')}</div>`;}

function fleet(p){
 const head=shipyardView(p);

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if((cloudBlocked||galaxyBusy)&&['planet','build','research','ship','probe','colony','import','reset'].includes(a)){toast('Bitte zuerst den Cloud-Spielstand laden.');return;}if(a==='ranking-refresh'){void refreshRanking(true);}else if(a==='tab'){tab=b.dataset.tab;render();if(tab==='leaderboard')void refreshRanking();if(tab==='galaxy')void refreshGalaxy();window.scrollTo({top:0,behavior:'smooth'});}else if(a==='planet'&&!readOnly){state.active=b.dataset.id;if(b.dataset.id.startsWith('g-'))tab='overview';persist(true);render();}else if(a==='settings')settings();else if(['build','research','ship','probe','colony'].includes(a)){command({type:a,key:b.dataset.key,to:b.dataset.to,count:a==='ship'?Number(document.getElementById('build-count-'+b.dataset.key)?.value||1):1});}else if(a==='export'){try{advance(state,Date.now());const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`wahuelapa-universe-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Sicherung exportiert.');}catch(e){toast(e.message);}}else if(a==='import')document.getElementById('import-file').click();else if(a==='reset'&&!readOnly&&confirm('Wirklich neu starten? Exportiere vorher deinen bisherigen Spielstand.')){if(cloud?.user){state=newGame(state.name);persist(true);void flushCloud();}else{state=null;try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SAVE_KEY+'-backup');}catch{}}document.querySelector('dialog')?.close();render();}});
document.addEventListener('change',async e=>{if(e.target.id==='planet-select'&&!readOnly&&!cloudBlocked&&!galaxyBusy){state.active=e.target.value;persist(true);render();}if(e.target.id==='import-file'&&!readOnly&&!cloudBlocked&&!galaxyBusy){try{const file=e.target.files[0];if(!file)return;if(file.size>2000000)throw Error('Datei ist zu groß.');const incoming=parseSave(await file.text());if(!confirm('Aktuellen Spielstand durch diese Sicherung ersetzen?'))return;state=advance(incoming,Date.now());persist(true);document.querySelector('dialog')?.close();render();toast('Spielstand importiert.');}catch(err){toast(err.message);}}if(e.target.closest('#transport-form'))transportEstimate();});
document.addEventListener('input',e=>{if(e.target.closest('#transport-form'))transportEstimate();});
function tick(){if(!state||readOnly||cloudBlocked||galaxyBusy)return;try{const before=state.seq;advance(state,Date.now());persist();if(before!==state.seq){render();return;}const p=getPlanet(state,state.active);document.querySelectorAll('[data-resource]').forEach(el=>el.textContent=fmt(p.resources[el.dataset.resource]));document.querySelectorAll('[data-due]').forEach(el=>el.textContent=duration(Number(el.dataset.due)-state.time));document.querySelectorAll('[data-route-progress]').forEach(el=>{const m=state.missions.find(m=>m.id===Number(el.dataset.routeProgress));if(m){const percent=Math.round(Math.min(100,Math.max(0,100*(state.time-m.start)/m.duration)));el.setAttribute('aria-valuenow',percent);el.querySelector('i').style.width=`${percent}%`;}});document.querySelectorAll('.job').forEach(el=>{const due=Number(el.querySelector('[data-due]').dataset.due);const jobs=[p.build,p.shipjob,state.research].filter(Boolean),j=jobs.find(j=>j.end===due);if(j)el.querySelector('i').style.width=`${Math.min(100,100*(state.time-j.start)/(j.end-j.start))}%`;}); // refresh disabled affordability without replacing a user's form
 if(tab==='build'||tab==='research'){const defs=tab==='build'?BUILDINGS:TECHS;document.querySelectorAll(`[data-action="${tab==='build'?'build':'research'}"]`).forEach(b=>{const inf=tab==='build'?buildInfo(state,p,b.dataset.key):researchInfo(state,p,b.dataset.key);const busy=tab==='build'?p.build:state.research;b.disabled=!!(inf.reason||busy||!affordable(p,inf.cost));const req=b.parentElement.querySelector('.requirement');if(req&&!inf.reason&&!busy&&affordable(p,inf.cost))req.textContent='';});}
  if(tab==='fleet'){document.querySelectorAll('[data-action="ship"]').forEach(b=>{const info=shipInfo(state,p,b.dataset.key);b.disabled=!!(readOnly||info.reason||p.shipjob||!affordable(p,info.cost));});}
 }catch(e){toast(e.message);}}
try{const loaded=loadGame();state=loaded.state;if(state)advance(state,Date.now());if(loaded.recovered)toast('Letzte intakte Sicherung wiederhergestellt.');}catch(e){storageOK=false;toast(e.message);}
if(navigator.locks){navigator.locks.request('imperium-active-tab',{ifAvailable:true},async lock=>{if(!lock){readOnly=true;render();return;}void initCloud();await new Promise(()=>{});});}else{window.addEventListener('storage',e=>{if(e.key===saveKey()){readOnly=true;render();toast('Ein anderer Tab hat gespeichert. Dieser Tab bleibt schreibgeschützt.');}});}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();if(state)render();}else persist(true);});
render();setInterval(tick,1000);if(!navigator.locks)void initCloud();
setInterval(()=>{if(cloudDirty&&Date.now()-cloudLastAttempt>=30000)void flushCloud();},5000);

function saveKey(){return cloud?.user?`${SAVE_KEY}-account-${cloud.user.id}`:SAVE_KEY;}
function cloudBadge(){if(cloudBlocked)return '⚠ Cloud laden · Einstellungen';if(!cloud?.user)return storageOK?'● Lokal gespeichert':'⚠ Speicherung fehlgeschlagen';return cloudMessage;}
function refreshCloudBadge(){const b=document.querySelector('.local-badge');if(b&&!readOnly)b.textContent=cloudBadge();}
let registrationEmail="";
function cloudPanel(){if(!CLOUD_CONFIG.enabled)return '<p class="fine">Cloud-Anmeldung wird vorbereitet. Aktuell speichert das Spiel automatisch in diesem Browser; Export sichert deinen Fortschritt zusätzlich.</p>';if(cloud?.user)return `<h3>Dein Konto</h3><p>${esc(cloud.user.email)}<br><span id="cloud-status">${esc(cloudMessage)}</span></p><div class="settings-actions">${button('Jetzt Cloud speichern','cloud-save','',cloudBlocked||cloudSaving)}${button('Cloud-Stand laden','cloud-load','',cloudSaving)}${button('Abmelden','cloud-logout','',cloudSaving)}</div><p class="fine">Automatische Cloud-Sicherung spätestens alle 30 Sekunden. Bei Gerätewechsel zuerst speichern. Gleichzeitige Änderungen werden nicht zusammengeführt.</p>`;return `<h3>Anmelden & auf anderen Geräten weiterspielen</h3>${registrationEmail?`<div class="notice" role="status"><strong>Bitte bestätige deine E-Mail-Adresse.</strong><p>Öffne die Bestätigungsmail für ${esc(registrationEmail)} und klicke auf den Bestätigungslink. Prüfe auch deinen Spam-Ordner. Melde dich danach hier an.</p><p>Falls für die Adresse bereits ein Konto besteht, kannst du dich mit diesem anmelden.</p></div>`:''}<form id="cloud-auth-form"><label>E-Mail<input name="email" type="email" required autocomplete="email"></label><label>Passwort<input name="password" type="password" maxlength="128" required autocomplete="current-password"></label><div class="settings-actions"><button type="submit" name="mode" value="login">Anmelden</button><button type="submit" name="mode" value="register">Konto erstellen</button></div></form><p class="fine">Beim ersten Login kannst du deinen Browser-Spielstand übernehmen. Zum Registrieren mindestens 8 Zeichen verwenden und anschließend die Bestätigungsmail öffnen.</p>`;}
function accountSetup(){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.innerHTML=`<span class="eyebrow">DEIN ERSTER CLOUD-SPIELSTAND</span><h2>Deine Heimatwelt erstellen</h2><p>Für dieses Konto gibt es noch keinen gespeicherten Spielstand.</p>${state?button(`Gast-Spielstand von ${esc(state.name)} übernehmen`,'cloud-adopt'):''}<form id="cloud-new-form"><label>Commander-Name<input name="name" maxlength="30" required value="${esc(state?.name||'')}"></label><button>Heimatwelt erstellen</button></form>${button('Abmelden','cloud-logout')}<p class="fine">Dein bisheriger Gast-Spielstand bleibt separat erhalten.</p>`;d.addEventListener('cancel',e=>e.preventDefault());document.body.append(d);d.showModal();}
async function loadAccount(discardLocal=false){if(galaxyBusy)return;cloudBlocked=true;cloudMessage='Cloud-Spielstand wird geladen …';refreshCloudBadge();try{let remote=await cloud.load();if(readOnly)return;if(!remote){accountSetup();return;}let meta=null,cached=null;try{meta=JSON.parse(localStorage.getItem(saveKey()+'-cloud-meta')||'null');cached=loadGame(localStorage,saveKey()).state;}catch{toast('Lokale Kontosicherung beschädigt. Cloud-Stand wird verwendet.');}if(!discardLocal&&meta?.pending&&cached){state=advance(cached,Date.now());activeAccountId=cloud.user.id;if(meta.revision!==cloud.revision){cloudMessage='⚠ Lokaler Stand und Cloud unterscheiden sich · exportieren oder Cloud laden';toast('Nicht synchronisierte lokale Änderungen gefunden. Exportiere sie oder lade bewusst den Cloud-Stand.');settings();return;}remote=state;}state=advance(remote,Date.now());activeAccountId=cloud.user.id;cloudBlocked=false;cloudDirty=true;cloudMessage='● Cloud geladen · lokale Sicherung aktiv';try{saveGame(state,localStorage,saveKey());storageOK=true;}catch{storageOK=false;toast('Lokale Sicherung nicht möglich. Bitte exportieren.');}document.querySelector('dialog')?.remove();render();}catch(e){if(activeAccountId!==cloud?.user?.id){try{const cached=loadGame(localStorage,saveKey()).state;if(cached){state=cached;activeAccountId=cloud.user.id;}}catch{}}cloudMessage='⚠ Cloud konnte nicht geladen werden';refreshCloudBadge();toast(e.message||'Cloud nicht erreichbar.');settings();}}
async function flushCloud(){if(readOnly||!cloud?.user||cloudBlocked||cloudSaving||!state)return false;cloudSaving=true;cloudLastAttempt=Date.now();const generation=cloudGeneration;const snapshot=structuredClone(state);cloudMessage='Cloud wird gespeichert …';refreshCloudBadge();try{await cloud.save(snapshot);cloudDirty=cloudGeneration!==generation;cloudLastSave=Date.now();try{localStorage.setItem(saveKey()+'-cloud-meta',JSON.stringify({revision:cloud.revision,pending:cloudDirty}));}catch{}cloudMessage=`● Cloud gespeichert · ${new Date(cloudLastSave).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`;return true;}catch(e){cloudMessage='⚠ Nur lokal gesichert · Cloud erneut versuchen';if(e instanceof CloudConflict){cloudBlocked=true;cloudMessage='⚠ Anderes Gerät gespeichert · Cloud neu laden';toast(e.message);settings();}else toast(e.message||'Cloud-Speicherung fehlgeschlagen. Lokale Sicherung bleibt erhalten.');return false;}finally{cloudSaving=false;refreshCloudBadge();if(tab==='leaderboard')void refreshRanking();const status=document.getElementById('cloud-status');if(status)status.textContent=cloudMessage;}}
async function finishAccount(initial){if(!cloud?.user||!cloud.loaded||cloud.revision!==0)return;state=initial;activeAccountId=cloud.user.id;cloudBlocked=false;cloudDirty=true;persist(true);const saving=flushCloud();cloudBlocked=true;if(await saving){cloudBlocked=false;document.querySelector('dialog')?.remove();render();}else settings();}
async function logoutAccount(){if(galaxyBusy){toast('Galaxie-Abgleich läuft.');return;}if(cloud?.user&&!cloudBlocked&&state){const saving=flushCloud();cloudBlocked=true;if(!await saving){cloudBlocked=!cloud.loaded;settings();return;}}cloudBlocked=true;try{await cloud.signOut();clearRanking();activeAccountId=null;state=loadGame().state;if(state)advance(state,Date.now());cloudBlocked=false;cloudDirty=false;document.querySelector('dialog')?.remove();render();}catch(e){toast(e.message);settings();}}
document.addEventListener('submit',async e=>{if(!['cloud-auth-form','cloud-new-form'].includes(e.target.id))return;e.preventDefault();if(readOnly||galaxyBusy)return;const form=e.target,d=new FormData(form);if(form.id==='cloud-new-form'){await finishAccount(newGame(d.get('name')));return;}if(cloudAuthBusy)return;cloudAuthBusy=true;form.querySelectorAll('button').forEach(b=>b.disabled=true);try{cloud??=await connectCloud(CLOUD_CONFIG);if(e.submitter?.value==='register'){if(String(d.get('password')).length<8)throw Error('Für ein neues Konto bitte mindestens 8 Zeichen verwenden.');await cloud.signUp(String(d.get('email')).trim(),String(d.get('password')));registrationEmail=String(d.get('email')).trim();form.reset();settings();toast('Bitte bestätige deine E-Mail-Adresse und melde dich danach an.');}else{await cloud.signIn(String(d.get('email')).trim(),String(d.get('password')));clearRanking();await loadAccount();if(tab==='leaderboard')void refreshRanking(true);}}catch(err){toast(err.message||'Anmeldung fehlgeschlagen.');}finally{cloudAuthBusy=false;form.querySelectorAll('button').forEach(b=>b.disabled=false);}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||readOnly)return;try{switch(b.dataset.action){case 'cloud-save':await flushCloud();break;case 'cloud-load':if(cloud?.user&&confirm('Cloud-Stand laden? Nicht synchronisierte Änderungen werden ersetzt. Bei Bedarf zuerst exportieren.'))await loadAccount(true);break;case 'cloud-logout':await logoutAccount();break;case 'cloud-adopt':if(state)await finishAccount(structuredClone(state));break;}}catch(err){toast(err.message);}});
async function initCloud(){if(!CLOUD_CONFIG.enabled||readOnly)return;cloudBlocked=true;try{cloud=await connectCloud(CLOUD_CONFIG);const user=await cloud.session();if(user)await loadAccount();else cloudBlocked=false;}catch(e){cloudMessage='⚠ Cloud-Verbindung nicht verfügbar';toast(e.message||cloudMessage); // Keep the guest save intact. Explicit login can retry.
 cloudBlocked=false;}render();}

document.addEventListener('submit',async e=>{if(e.target.id!=='system-name-form')return;e.preventDefault();if(!state||readOnly||cloudBlocked||galaxyBusy)return;const name=String(new FormData(e.target).get('systemName')||'').trim();if(!name||name.length>30){toast('Bitte einen Namen mit 1–30 Zeichen wählen.');return;}state.systemName=name;persist(true);render();toast('Sonnensystem-Name gespeichert.');if(cloud?.user&&await flushCloud())void refreshGalaxy(true);});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&galaxyExpanded&&!document.querySelector('dialog[open]')){galaxyExpanded=false;galaxyCamera=null;render();document.getElementById('galaxy-expand')?.focus();}});
</script></body></html>
