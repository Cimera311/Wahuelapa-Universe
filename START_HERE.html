function planet(id,name,meta={}){
 return {id,name,coord:meta.coord||'1:1:4',kind:meta.kind||'Heimatwelt',mult:meta.mult||[1,1,1],color:meta.color||'#53add3',ocean:meta.ocean??true,energy:meta.energy||1,distance:meta.distance||0,reserves:vector([0,0,0]),resources:vector([0,0,0]),depot:vector([0,0,0]),buildings:Object.fromEntries(Object.keys(BUILDINGS).map(k=>[k,0])),ships:{probe:0,transport:0,colony:0},build:null,shipjob:null};
}
function newGame(name='Commander',now=Date.now()){
 const home=planet('home','Aurelia');
 home.resources=vector([3000,2200,1000]); Object.assign(home.buildings,{metal:1,crystal:1,fuel:1,solar:3});
 return {version:1,name:name.trim().slice(0,30)||'Commander',time:now,created:now,seq:0,active:'home',planets:[home],tech:Object.fromEntries(Object.keys(TECHS).map(k=>[k,0])),research:null,discovered:[],missions:[],reports:[]};
}

function stats(s,p){
 const supply=(p.buildings.solar*45+p.buildings.tidal*180)*(1+s.tech.energy*.1);
 const demand=(p.buildings.metal*15+p.buildings.crystal*18+p.buildings.fuel*20)*p.energy;
 const ratio=demand?Math.min(1,supply/demand):1;
 const rates=vector(RES.map((k,i)=>p.buildings[k]?([300,220,140][i]*p.buildings[k]*Math.pow(1.12,p.buildings[k]-1)*p.mult[i]*ratio):0));

function settle(p){const cap=capacity(p);for(const k of RES){const n=Math.min(Math.max(0,cap-p.resources[k]),p.depot[k]);p.resources[k]+=n;p.depot[k]-=n;}}

function report(s,title,body){s.reports.unshift({id:++s.seq,time:s.time,title,body});s.reports=s.reports.slice(0,60);}
function need(s,p,req){if(!req)return '';if(req.tech&&s.tech[req.tech]<req.level)return `Benötigt ${TECHS[req.tech].name} Stufe ${req.level}.`;if(req.building&&p.buildings[req.building]<req.level)return `Benötigt ${BUILDINGS[req.building].name} Stufe ${req.level}.`;return '';}
function buildInfo(s,p,key){const b=BUILDINGS[key];if(!b)throw Error('Unbekanntes Gebäude.');const l=p.buildings[key];return {cost:costAt(b,l),ms:Math.ceil(b.time*Math.pow(1.35,l)*Math.pow(.95,s.tech.engineering)*Math.pow(.92,p.buildings.robotics)*1000),reason:need(s,p,b.requires)||(b.ocean&&!p.ocean?'Benötigt einen Ozeanplaneten.':'')||(l>=30?'Maximale Prototyp-Stufe 30 erreicht.':'')};}
function researchInfo(s,p,key){const t=TECHS[key];if(!t)throw Error('Unbekannte Forschung.');const l=s.tech[key];return {cost:costAt(t,l),ms:Math.ceil(t.time*Math.pow(1.5,l)/Math.max(1,1+(p.buildings.lab-1)*.15)*1000),reason:p.buildings.lab<t.lab?`Benötigt Forschungslabor Stufe ${t.lab} auf diesem Planeten.`:need(s,p,t.requires)||(l>=t.max?'Maximale Forschungsstufe erreicht.':'')};}
function pay(p,c){settle(p);for(const k of RES)if(!Number.isFinite(c[k])||c[k]<0||p.resources[k]+1e-8<c[k])throw Error('Nicht genügend lokale Ressourcen.');for(const k of RES)p.resources[k]=Math.max(0,p.resources[k]-c[k]);settle(p);}
function cargoCapacity(s,n=1){return Math.floor(1000*(1+s.tech.logistics*.15))*n;}
function flightInfo(s,from,to,n=1,probe=false){const dist=Math.max(1,Math.abs((from.distance||0)-(to.distance||0)));return {ms:Math.ceil((10+dist*8)*1000/(1+s.tech.drive*.12+(probe?s.tech.scout*.1:0))),fuel:Math.ceil((probe?3:8)*dist*n/(1+s.tech.drive*.12))};}
// Fleet fuel is prepaid for a complete itinerary; cargo never includes engine fuel.
function legInfo(s,from,to,n=1){const f=flightInfo(s,from,to,n);return {...f,fuel:Math.ceil(f.fuel/2)};}
function routeInfo(s,stops,count){let fuel=0,ms=0;for(let i=0;i<stops.length;i++){const f=legInfo(s,getPlanet(s,stops[i].planet),getPlanet(s,stops[(i+1)%stops.length].planet),count);fuel+=f.fuel;ms+=f.ms;}return {fuel,ms};}
function validOrder(order){return order&&RES.every(k=>order[k]==='max'||Number.isSafeInteger(order[k])&&order[k]>=0&&order[k]<=1e12);}

function parkFleet(s,m,id,title){const p=getPlanet(s,id);deliver(p,m.cargo);p.ships[m.ship]+=m.count;s.missions=s.missions.filter(x=>x.id!==m.id);report(s,title,`${m.count} × ${SHIPS[m.ship].name} im Orbit von ${p.name}. Ladung wurde eingelagert.`);}
function routeArrival(s,m){
 if(m.index===0){deliver(getPlanet(s,m.home),m.cargo);m.cargo=vector([0,0,0]);m.rounds++;report(s,'Handelsrunde abgeschlossen',`${m.name}: Runde ${m.rounds} beendet.`);
  if(!m.repeat||m.stopping){parkFleet(s,m,m.home,'Handelsroute beendet');return;}
  const p=getPlanet(s,m.home),f=routeInfo(s,m.stops,m.count);

  pay(p,vector([0,0,f.fuel]));stopCargo(s,m,m.stops[0]);leaveRoute(s,m,1);
 }else{stopCargo(s,m,m.stops[m.index]);report(s,'Handelsstopp',`${m.name}: ${getPlanet(s,m.to).name} · Runde ${m.rounds+1}.`);leaveRoute(s,m,(m.index+1)%m.stops.length);}
}
function advance(s,now){
 if(!Number.isFinite(now))throw Error('Ungültige Zeit.');now=Math.max(now,s.time);
 let guard=0;
 while(true){
  const times=[];for(const p of s.planets){if(p.build)times.push(p.build.end);if(p.shipjob)times.push(p.shipjob.end);}if(s.research)times.push(s.research.end);for(const m of s.missions)times.push(m.due);
  const next=Math.min(...times);if(next>now||!Number.isFinite(next))break;if(++guard>100000){for(const m of s.missions)if(m.type==='route'&&!m.stopping){m.stopping=true;report(s,'Handelsroute endet nach langer Abwesenheit',`${m.name}: Die aktuelle Runde wird noch abgeschlossen.`);}guard=0;}
  produce(s,Math.max(0,next-s.time));s.time=Math.max(s.time,next);
  // Fixed order: research, buildings, shipbuilding, then missions by id.
  if(s.research&&s.research.end<=s.time){const j=s.research;s.tech[j.key]=j.level;s.research=null;report(s,'Forschung abgeschlossen',`${TECHS[j.key].name} erreicht Stufe ${j.level}.`);}
  for(const p of s.planets){if(p.build&&p.build.end<=s.time){const j=p.build;p.buildings[j.key]=j.level;p.build=null;report(s,'Ausbau abgeschlossen',`${p.name}: ${BUILDINGS[j.key].name}, Stufe ${j.level}.`);}if(p.shipjob&&p.shipjob.end<=s.time){const j=p.shipjob;p.ships[j.key]+=j.count;p.shipjob=null;report(s,'Schiffbau abgeschlossen',`${p.name}: ${j.count} × ${SHIPS[j.key].name}.`);}}
  for(const m of [...s.missions].sort((a,b)=>a.id-b.id))if(m.due<=s.time){
   if(m.type==='route'){routeArrival(s,m);}
   else if(m.type==='station'){parkFleet(s,m,m.to,'Flotte stationiert');}
   else if(m.type==='collect'&&m.phase==='outbound'){loadCargo(s,getPlanet(s,m.to),m.cargo,m.order,m.count);m.phase='return';m.due=s.time+m.duration;report(s,'Material abgeholt',`${getPlanet(s,m.to).name}: Ladung auf dem Rückweg.`);}
   else if(m.phase==='return'){if(m.type==='collect')deliver(getPlanet(s,m.from),m.cargo);getPlanet(s,m.from).ships[m.ship]+=m.count;s.missions=s.missions.filter(x=>x.id!==m.id);report(s,'Flotte zurückgekehrt',`${SHIPS[m.ship].name}: ${m.count} zurück auf ${getPlanet(s,m.from).name}.`);}
   else if(m.type==='probe'){if(!s.discovered.includes(m.to))s.discovered.push(m.to);const t=TARGETS.find(t=>t.id===m.to);report(s,'Sondenbericht',`${t.name} [${t.coord}] · ${t.kind}. Metall ×${t.mult[0]}, Kristall ×${t.mult[1]}, Treibstoff ×${t.mult[2]}. Energiebedarf ×${t.energy}.`);m.phase='return';m.due=s.time+m.duration;}
   else if(m.type==='colony'){const t=TARGETS.find(t=>t.id===m.to);if(!s.planets.some(p=>p.id===t.id)){const p=planet(t.id,t.name,t);p.buildings.solar=2;deliver(p,m.cargo);s.planets.push(p);report(s,'Kolonie gegründet',`${t.name} ist besiedelt. Mitgebrachte Startmaterialien stehen dort bereit. Baue zuerst lokale Minen.`);}s.missions=s.missions.filter(x=>x.id!==m.id);}
   else {deliver(getPlanet(s,m.to),m.cargo);report(s,'Transport angekommen',`${getPlanet(s,m.from).name} → ${getPlanet(s,m.to).name}: ${RES.map(k=>`${Math.round(m.cargo[k])} ${k==='metal'?'Metall':k==='crystal'?'Kristall':'Treibstoff'}`).join(', ')}. Überschüsse bleiben im Lieferdepot.`);m.cargo=vector([0,0,0]);m.phase='return';m.due=s.time+m.duration;}
  }

function act(s,action,now=Date.now()){
 // Work on a copy; a rejected command cannot partially mutate the caller.
 const n=structuredClone(s);advance(n,now);const p=getPlanet(n,action.planet||n.active);
 if(action.type==='build'){const info=buildInfo(n,p,action.key);if(info.reason)throw Error(info.reason);if(p.build)throw Error('Auf diesem Planeten läuft bereits ein Bauauftrag.');pay(p,info.cost);p.build={key:action.key,level:p.buildings[action.key]+1,start:n.time,end:n.time+info.ms};}
 else if(action.type==='research'){const info=researchInfo(n,p,action.key);if(info.reason)throw Error(info.reason);if(n.research)throw Error('Es läuft bereits eine imperiumsweite Forschung.');pay(p,info.cost);n.research={key:action.key,level:n.tech[action.key]+1,start:n.time,end:n.time+info.ms,planet:p.id};}
 else if(action.type==='ship'){const sh=SHIPS[action.key];if(!sh)throw Error('Unbekanntes Schiff.');if(!p.buildings.shipyard)throw Error('Benötigt Schiffswerft Stufe 1.');if(!n.tech[sh.tech])throw Error(`Benötigt ${TECHS[sh.tech].name} Stufe 1.`);if(p.shipjob)throw Error('Die Schiffswerft ist beschäftigt.');const count=action.count;if(!Number.isInteger(count)||count<1||count>50)throw Error('Baue zwischen 1 und 50 Schiffe.');pay(p,vector(sh.cost.map(v=>v*count)));p.shipjob={key:action.key,count,start:n.time,end:n.time+sh.time*count*1000};}
 else if(action.type==='probe'||action.type==='colony'||action.type==='transport'){
  const ship=action.type==='probe'?'probe':action.type==='colony'?'colony':'transport';const count=ship==='transport'?action.count:1;if(!Number.isInteger(count)||count<1||count>100)throw Error('Ungültige Flottengröße.');if(p.ships[ship]<count)throw Error('Nicht genügend verfügbare Schiffe.');
  let dest,cargo=vector([0,0,0]);
  if(ship==='transport'){dest=getPlanet(n,action.to);if(dest.id===p.id)throw Error('Wähle einen anderen Zielplaneten.');cargo=action.cargo;if(!cargo||RES.some(k=>!Number.isSafeInteger(cargo[k])||cargo[k]<0))throw Error('Ladung muss aus nichtnegativen ganzen Zahlen bestehen.');const total=RES.reduce((sum,k)=>sum+cargo[k],0);if(!total)throw Error('Wähle eine Ladung.');if(total>cargoCapacity(n,count))throw Error('Die Ladung übersteigt den Laderaum.');}
  else {dest=TARGETS.find(t=>t.id===action.to);if(!dest)throw Error('Unbekanntes Erkundungsziel.');if(ship==='colony'){if(!n.discovered.includes(dest.id))throw Error('Zuerst mit einer Sonde erkunden.');if(n.planets.some(p=>p.id===dest.id)||n.missions.some(m=>m.type==='colony'&&m.to===dest.id))throw Error('Planet bereits besiedelt oder reserviert.');if(n.planets.length-1+n.missions.filter(m=>m.type==='colony').length>=n.tech.colonization)throw Error('Erforsche eine weitere Kolonisierungsstufe.');cargo=vector([350,250,100]);}}
  const f=flightInfo(n,p,dest,count,ship==='probe');const cost={...cargo,fuel:cargo.fuel+f.fuel};pay(p,cost);p.ships[ship]-=count;n.missions.push({id:++n.seq,type:action.type,ship,count,from:p.id,to:dest.id,cargo,phase:'outbound',start:n.time,duration:f.ms,due:n.time+f.ms});
 }
 else if(action.type==='reserve'){if(!action.reserves||RES.some(k=>!Number.isSafeInteger(action.reserves[k])||action.reserves[k]<0||action.reserves[k]>1e12))throw Error('Ungültige Reserve.');p.reserves={...action.reserves};}
 else if(action.type==='stop-route'){const m=n.missions.find(m=>m.id===action.id&&m.type==='route');if(!m)throw Error('Route nicht gefunden.');m.stopping=true;report(n,'Route endet nach dieser Runde',m.name);}

  if(action.type!=='station'&&action.ship&&action.ship!=='transport')throw Error('Liefern, Abholen und Handelsrouten benötigen Transporter.');
  const ship=action.type==='station'?(action.ship||'transport'):'transport',count=action.count;
  if(!Object.hasOwn(SHIPS,ship)||!Number.isInteger(count)||count<1||count>100||p.ships[ship]<count)throw Error('Nicht genügend verfügbare Schiffe (1–100 pro Flotte).');
  const cargo=vector([0,0,0]);let m={id:++n.seq,type:action.type,ship,count,from:p.id,cargo,phase:'outbound',start:n.time};
  if(action.type==='route'){
   const stops=action.stops;if(!Array.isArray(stops)||stops.length<2||stops.length>12||stops[0].planet!==p.id)throw Error('Eine Route benötigt 2–12 Stopps und beginnt hier.');
   for(let i=0;i<stops.length;i++){getPlanet(n,stops[i].planet);if(stops[i].planet===stops[(i+1)%stops.length].planet||!validOrder(stops[i].load)||!validOrder(stops[i].unload))throw Error('Ungültiger Stopp oder Laderegel.');}
   const f=routeInfo(n,stops,count);if(p.resources.fuel-(p.reserves?.fuel||0)<f.fuel)throw Error('Treibstoff reicht nicht für die Runde einschließlich Reserve.');pay(p,vector([0,0,f.fuel]));
   Object.assign(m,{name:String(action.name||'Handelsroute').trim().slice(0,40)||'Handelsroute',stops:structuredClone(stops),home:p.id,index:0,repeat:!!action.repeat,stopping:false,rounds:0});stopCargo(n,m,stops[0]);leaveRoute(n,m,1);
  }else{
   const dest=getPlanet(n,action.to);if(dest.id===p.id)throw Error('Wähle einen anderen Zielplaneten.');const f=legInfo(n,p,dest,count);
   const order=action.order||action.cargo||vector([0,0,0]);if(!validOrder(order))throw Error('Ladung: ganze Mengen oder Maximum wählen.');

   if(action.type!=='collect'){const exact=RES.reduce((a,k)=>a+(order[k]==='max'?0:order[k]),0);if(exact>cargoCapacity(n,count)||RES.some(k=>order[k]!=='max'&&order[k]>Math.floor(Math.max(0,p.resources[k]+p.depot[k]-(p.reserves?.[k]||0)))))throw Error('Die gewählte Ladung passt nicht oder lokale Ressourcen fehlen.');loadCargo(n,p,cargo,order,count);if(action.type==='deliver'&&!RES.some(k=>cargo[k]>0))throw Error('Wähle verfügbare Ladung.');}else {if(!RES.some(k=>order[k]==='max'||order[k]>0))throw Error('Wähle Material zum Abholen.');m.order={...order};}
   Object.assign(m,{to:dest.id,duration:f.ms,due:n.time+f.ms});
  }
  p.ships[ship]-=count;n.missions.push(m);
 }
 else throw Error('Unbekannte Aktion.');return n;
}


const SAVE_KEY='imperium-v1';
const isNum=(x,max=1e12)=>typeof x==='number'&&Number.isFinite(x)&&x>=0&&x<=max;
const integer=(x,max)=>isNum(x,max)&&Number.isInteger(x);
const text=(x,max=100)=>typeof x==='string'&&x.length<=max;
function check(ok){if(!ok)throw Error('Ungültiger oder inkompatibler Spielstand.');}
function validateSave(input){
 check(input&&typeof input==='object'&&input.version===1);
 const s=structuredClone(input);
 check(text(s.name,30)&&s.name.trim().length>0&&isNum(s.time,8.64e15)&&isNum(s.created,8.64e15)&&s.created<=s.time&&integer(s.seq,1e9));
 check(Array.isArray(s.planets)&&s.planets.length>=1&&s.planets.length<=3);
 check(s.tech&&Object.entries(TECHS).every(([k,t])=>integer(s.tech[k],t.max)));
 const ids=s.planets.map(p=>p.id);check(ids[0]==='home'&&new Set(ids).size===ids.length&&ids.every(id=>id==='home'||TARGETS.some(t=>t.id===id))&&ids.includes(s.active));
 const cargo=c=>c&&RES.every(k=>isNum(c[k]));
 const job=(j,defs)=>j===null||(j&&Object.hasOwn(defs,j.key)&&isNum(j.start,8.64e15)&&isNum(j.end,8.64e15)&&j.start<=s.time&&j.end>=s.time&&j.end>j.start);
 for(const p of s.planets){check(text(p.name,40)&&text(p.coord,30)&&text(p.kind,40)&&/^#[0-9a-f]{6}$/i.test(p.color)&&typeof p.ocean==='boolean'&&isNum(p.energy,10)&&p.energy>0&&isNum(p.distance,100));check(Array.isArray(p.mult)&&p.mult.length===3&&p.mult.every(x=>isNum(x,10)));p.reserves??={metal:0,crystal:0,fuel:0};check(cargo(p.reserves)&&cargo(p.resources)&&cargo(p.depot));check(p.buildings&&Object.keys(BUILDINGS).every(k=>integer(p.buildings[k],30)));check(p.ships&&Object.keys(SHIPS).every(k=>integer(p.ships[k],1e6)));check(job(p.build,BUILDINGS)&&(!p.build||p.build.level===p.buildings[p.build.key]+1));check(job(p.shipjob,SHIPS)&&(!p.shipjob||integer(p.shipjob.count,50)&&p.shipjob.count>0));}
 check(job(s.research,TECHS)&&(!s.research||s.research.level===s.tech[s.research.key]+1&&ids.includes(s.research.planet)));
 check(Array.isArray(s.discovered)&&s.discovered.length<=3&&new Set(s.discovered).size===s.discovered.length&&s.discovered.every(id=>TARGETS.some(t=>t.id===id)));
 check(Array.isArray(s.missions)&&s.missions.length<=100);
 const eventIds=[];
 const order=o=>o&&RES.every(k=>o[k]==='max'||integer(o[k],1e12));
 for(const m of s.missions){
  check(integer(m.id,s.seq)&&m.id>0&&ids.includes(m.from)&&['probe','colony','transport','deliver','collect','station','route'].includes(m.type)&&Object.hasOwn(SHIPS,m.ship)&&integer(m.count,100)&&m.count>0&&cargo(m.cargo)&&['outbound','return'].includes(m.phase)&&isNum(m.start,8.64e15)&&m.start<=s.time&&isNum(m.due,8.64e15)&&m.due>=s.time&&isNum(m.duration,86400000)&&m.duration>0);
  if(['probe','colony'].includes(m.type)){check(m.ship===m.type&&TARGETS.some(t=>t.id===m.to));check(m.type!=='colony'||m.phase==='outbound'&&m.count===1&&!ids.includes(m.to));}
  else {check(ids.includes(m.to)&&m.from!==m.to);check(m.type==='station'||m.ship==='transport');}
  if(m.type==='collect')check(order(m.order));
  if(m.type==='station')check(m.phase==='outbound');
  if(m.type==='route'){
   check(m.phase==='outbound'&&text(m.name,40)&&typeof m.repeat==='boolean'&&typeof m.stopping==='boolean'&&integer(m.rounds,1e12)&&Array.isArray(m.stops)&&m.stops.length>=2&&m.stops.length<=12&&ids.includes(m.home)&&m.stops[0].planet===m.home&&integer(m.index,m.stops.length-1));
   check(m.stops.every((stop,i)=>ids.includes(stop.planet)&&stop.planet!==m.stops[(i+1)%m.stops.length].planet&&order(stop.load)&&order(stop.unload))&&m.to===m.stops[m.index].planet&&m.from===m.stops[(m.index+m.stops.length-1)%m.stops.length].planet);
  }
  eventIds.push(m.id);
 }
 check(new Set(eventIds).size===eventIds.length);
 check(Array.isArray(s.reports)&&s.reports.length<=60&&s.reports.every(r=>integer(r.id,s.seq)&&isNum(r.time,8.64e15)&&r.time<=s.time&&text(r.title,100)&&text(r.body,1000)));
 return s;
}
function parseSave(raw){if(typeof raw!=='string'||raw.length>2000000)throw Error('Die Spielstanddatei ist zu groß.');try{return validateSave(JSON.parse(raw));}catch(e){throw Error(e.message==='Die Spielstanddatei ist zu groß.'?e.message:'Die Datei enthält keinen gültigen WaHueLaPa-Universe-Spielstand (Version 1).');}}
function saveGame(s,store=globalThis.localStorage,key=SAVE_KEY){const raw=JSON.stringify(s);const old=store.getItem(key);if(old)store.setItem(key+'-backup',old);store.setItem(key,raw);}
function loadGame(store=globalThis.localStorage,saveKey=SAVE_KEY){let damaged=false;for(const key of [saveKey,saveKey+'-backup']){const raw=store.getItem(key);if(raw){try{return {state:parseSave(raw),recovered:damaged};}catch{damaged=true;}}}if(damaged)throw Error('Spielstand und Sicherung sind beschädigt. Exportiere vorhandene Dateien oder starte bewusst neu.');return {state:null,recovered:false};}

class CloudConflict extends Error {constructor(){super('Ein anderes Gerät hat einen neueren Spielstand gespeichert. Exportiere bei Bedarf deinen lokalen Stand und lade dann den Cloud-Stand.');this.name='CloudConflict';}}
// Client injected for tests. Saves use a database-side atomic revision check.
function createCloud(client,redirectUrl){
 let user=null,revision=0,loaded=false,busy=false;
 const checked=result=>{if(result.error)throw result.error;return result.data;};
 return {
  get user(){return user;},get revision(){return revision;},get loaded(){return loaded;},
  async session(){const data=checked(await client.auth.getSession());user=data.session?.user||null;loaded=false;return user;},
  async signIn(email,password){const data=checked(await client.auth.signInWithPassword({email,password}));user=data.user;loaded=false;return user;},
  async signUp(email,password){return checked(await client.auth.signUp({email,password,options:{emailRedirectTo:redirectUrl}}));},
  async signOut(){checked(await client.auth.signOut());user=null;revision=0;loaded=false;},
  async leaderboard(){if(!user)throw Error('Bitte anmelden, um die gemeinsame Rangliste zu sehen.');const result=await client.rpc('imperium_leaderboard');if(result.error){if(result.error.code==='PGRST202'||result.error.code==='42883')throw Error('Die Rangliste benötigt noch die einmalige Supabase-Erweiterung (supabase/leaderboard.sql).');throw result.error;}if(!Array.isArray(result.data))throw Error('Ungültige Ranglisten-Antwort.');return result.data;},
  async load(){if(!user)throw Error('Bitte anmelden.');if(busy)throw Error('Speicherung läuft noch.');loaded=false;const row=checked(await client.from('game_saves').select('state,revision').eq('user_id',user.id).maybeSingle());const state=row?validateSave(row.state):null;revision=row?Number(row.revision):0;if(!Number.isSafeInteger(revision)||revision<0)throw Error('Ungültige Cloud-Version.');loaded=true;return state;},
  async save(state){if(!user||!loaded)throw Error('Cloud-Spielstand zuerst laden.');if(busy)throw Error('Speicherung läuft noch.');const snapshot=validateSave(state);busy=true;try{const result=await client.rpc('save_imperium',{p_state:snapshot,p_expected:revision});if(result.error){if(result.error.message?.includes('SAVE_CONFLICT')){loaded=false;throw new CloudConflict();}throw result.error;}const next=Number(result.data);if(next!==revision+1)throw Error('Cloud-Speicherung lieferte keine gültige Bestätigung.');revision=next;return next;}finally{busy=false;}}
 };
}
async function connectCloud(config){
 if(!config.enabled)return null;
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(config.url)||!config.publishableKey)throw Error('Cloud-Konfiguration fehlt oder ist ungültig.');
 const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
 return createCloud(createClient(config.url,config.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),config.redirectUrl);
}

function fleetDraftKey(planet){return `${cloud?.user?.id||'guest'}:${planet}`;}
function captureFleetDraft(){for(const id of ['fleet-order-form','route-form','reserve-form']){const form=document.getElementById(id);if(!form)continue;const key=fleetDraftKey(form.dataset.planet),draft=fleetDrafts.get(key)||{};draft[id]={fields:[...form.elements].filter(el=>el.name).map(el=>({name:el.name,value:el.value})),stops:id==='route-form'?readRouteStops(form):null};fleetDrafts.set(key,draft);}}
function restoreFleetDraft(){const draft=fleetDrafts.get(fleetDraftKey(state.active));if(!draft)return;for(const [id,saved] of Object.entries(draft)){const form=document.getElementById(id);if(!form)continue;if(saved.stops)form.querySelector('#route-stops').innerHTML=saved.stops.map((stop,i)=>routeStopRow(stop.planet,i===0)).join('');const seen={};for(const field of saved.fields){const i=seen[field.name]||0;seen[field.name]=i+1;const el=form.querySelectorAll(`[name="${field.name}"]`)[i];if(el)el.value=field.value;}}}
function orderValue(v){const x=String(v).trim().toLowerCase();return x==='max'?'max':x!==''?Number(x):NaN;}
function readRouteStops(form){return [...form.querySelectorAll('.route-stop')].map(row=>({planet:row.querySelector('[name="stop-planet"]').value,load:Object.fromEntries(RES.map(k=>[k,orderValue(row.querySelector(`[name="load-${k}"]`).value)])),unload:Object.fromEntries(RES.map(k=>[k,orderValue(row.querySelector(`[name="unload-${k}"]`).value)]))}));}
function fleetEstimates(){
 if(!state)return;const p=getPlanet(state,state.active),form=document.getElementById('fleet-order-form');
 if(form){const d=new FormData(form),to=state.planets.find(q=>q.id===d.get('to')),count=Number(d.get('count')),ship=d.get('ship'),type=d.get('type');if(to&&count>0){const f=legInfo(state,p,to,count);document.getElementById('fleet-estimate').textContent=`${ship==='transport'?fmt(cargoCapacity(state,count)):0} Laderaum · ${duration(f.ms)} je Strecke · ${f.fuel*(type==='station'?1:2)} Treibstoff insgesamt${type!=='station'&&ship!=='transport'?' · Für diesen Auftrag Transporter wählen':''}`;}}
 const route=document.getElementById('route-form');if(route){const stops=readRouteStops(route),count=Number(new FormData(route).get('count'));if(count>0){if(stops.length<2||stops.some((q,i)=>q.planet===stops[(i+1)%stops.length].planet)){document.getElementById('route-estimate').textContent='Wähle mindestens zwei Stopps ohne direkt aufeinanderfolgende gleiche Planeten; die letzte Welt muss sich vom Startplaneten unterscheiden.';return;}const f=routeInfo(state,stops,count);document.getElementById('route-estimate').textContent=`${stops.map(q=>getPlanet(state,q.planet).name).join(' → ')} → ${p.name} · ${duration(f.ms)} pro Runde · ${f.fuel} Treibstoff pro Runde · ${fmt(cargoCapacity(state,count))} Laderaum`;}}
}

let rankingRows=[],rankingBusy=false,rankingError='',rankingTime=0,rankingRequest=0;
function leaderboard(){
 const intro='<div class="page-heading"><span class="eyebrow">WaHueLaPa Universe · Commander</span><h1>Rangliste</h1><p>Wer baut das stärkste Imperium?</p></div>';
 if(!cloud?.user)return intro+'<section class="panel"><h2>Gemeinsam vergleichen</h2><p>Melde dich an und speichere dein Imperium in der Cloud, um dabei zu sein.</p>'+button('Anmelden / Konto erstellen','settings')+'</section>';
 return intro+`<section class="panel"><div class="split"><div><h2>Imperiumspunkte</h2><p class="fine">${rankingTime?'Abgerufen '+new Date(rankingTime).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'Stand: letzter Cloud-Spielstand je Commander'}</p></div>${button(rankingBusy?'Lädt …':'Aktualisieren','ranking-refresh','',rankingBusy)}</div>${rankingError?`<p class="requirement" role="status">${esc(rankingError)}</p>`:''}${rankingError.includes('leaderboard.sql')?'<p><a href="https://github.com/Cimera311/Wahuelapa-Universe/blob/main/supabase/leaderboard.sql" target="_blank" rel="noopener">SQL-Erweiterung öffnen</a></p>':''}${rankingRows.length?`<div class="ranking-scroll"><table class="ranking-table"><caption class="fine">Top 100 und dein eigener Rang · gleiche Punkte teilen einen Rang</caption><thead><tr><th scope="col">Rang</th><th scope="col">Commander</th><th scope="col">Punkte</th><th scope="col">Kolonien</th></tr></thead><tbody>${rankingRows.map(r=>`<tr class="${r.is_me?'ranking-me':''}"><td>${fmt(r.rank)}</td><th scope="row">${esc(r.commander)}${r.is_me?' <span class="cyan">· Du</span>':''}</th><td><strong>${fmt(r.points)}</strong><small>Gebäude ${fmt(r.building_points)} · Forschung ${fmt(r.research_points)} · Flotte ${fmt(r.fleet_points)}</small></td><td>${fmt(r.colonies)}</td></tr>`).join('')}</tbody></table></div>`:!rankingBusy&&!rankingError?'<p class="muted">Noch keine Imperien gespeichert. Speichere deinen Cloud-Spielstand, um den Anfang zu machen.</p>':rankingBusy?'<p class="muted" role="status">Rangliste wird geladen …</p>':''}</section><section class="panel"><h2>So entstehen deine Punkte</h2><p>Je 100 verbaute Ressourcen ergeben einen Punkt. Es zählen die Kosten aller abgeschlossenen Gebäudestufen, Forschungen und deiner vorhandenen Schiffe. Flotten unterwegs zählen mit. Lagerbestände und laufende Bauaufträge zählen nicht.</p><p class="fine">Die drei Bereiche werden einzeln abgerundet und addiert. Startgebäude zählen ebenfalls. Die Rangliste zeigt den zuletzt gespeicherten Cloud-Stand; sie aktualisiert sich beim Öffnen und über „Aktualisieren“. Commander-Namen und Ranglistenwerte sind für angemeldete Spieler sichtbar.</p></section>`;
}
async function refreshRanking(force=false){
 if(rankingBusy||!cloud?.user||(!force&&Date.now()-rankingTime<15000))return;
 const request=++rankingRequest,account=cloud.user.id;rankingBusy=true;rankingError='';if(tab==='leaderboard')render();
 try{const rows=await cloud.leaderboard();if(request!==rankingRequest||cloud?.user?.id!==account)return;rankingRows=rows;rankingTime=Date.now();}catch(e){if(request===rankingRequest&&cloud?.user?.id===account)rankingError=e.message||'Rangliste nicht erreichbar. Bitte erneut versuchen.';}finally{if(request===rankingRequest){rankingBusy=false;if(tab==='leaderboard')render();}}
}
function clearRanking(){rankingRequest++;rankingRows=[];rankingBusy=false;rankingError='';rankingTime=0;}
function render(){captureFleetDraft();if(!state){app.innerHTML=`<main class="welcome"><div class="brand">WaHueLaPa<span>Universe</span></div>${orb({color:'#53add3',kind:'Heimatplanet',buildings:{}})}<section class="panel"><span class="eyebrow">SOLO · VERSION 0.1</span><h1>Deine erste Welt.</h1><p>Erkunde fremde Planeten, spezialisiere Kolonien und verbinde sie mit deiner Transportflotte.</p><form id="start-form"><label>Dein Commander-Name<input name="name" maxlength="30" placeholder="z. B. Sebastian" required autocomplete="nickname"></label><button ${readOnly?'disabled':''}>Imperium gründen →</button></form><p class="fine">Als Gast wird dein Fortschritt automatisch in diesem Browser gespeichert.</p>${CLOUD_CONFIG.enabled?button('Anmelden / Konto erstellen','settings'):''}</section></main>`;return;}
 const p=getPlanet(state,state.active),z=stats(state,p);app.innerHTML=`<header><div class="topbar"><button class="brand plain" data-action="tab" data-tab="overview">WaHueLaPa<span>Universe</span></button><div class="commander">${esc(state.name)} <button class="plain gear" data-action="settings" aria-label="Spielstand und Hilfe">⚙</button></div></div><div class="resources">${RES.map(k=>`<div><span class="resource-icon">${ICON[k]}</span><div><small>${LABEL[k]}</small><strong data-resource="${k}">${fmt(p.resources[k])}</strong><small>${fmt(z.rates[k])}/Std · Lager ${fmt(z.cap)}</small></div></div>`).join('')}<div><span class="resource-icon amber">ϟ</span><div><small>Energie</small><strong class="${z.supply-z.demand<0?'amber':''}">${Math.round(z.supply-z.demand)>0?'+':''}${Math.round(z.supply-z.demand)}</strong><small>${Math.round(z.supply)} / ${Math.round(z.demand)}</small></div></div></div><div class="planet-bar"><label>Aktive Welt <select id="planet-select">${state.planets.map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.name)} · [${esc(q.coord)}]</option>`).join('')}</select></label><span class="local-badge">${readOnly?'Nur Ansicht · anderer Tab aktiv':cloudBadge()}</span></div></header><main>${RES.some(k=>p.depot[k]>0)?`<div class="notice">Lieferdepot: ${costHTML(p.depot)}. Wird automatisch übernommen, sobald Lagerplatz frei ist.</div>`:''}${({overview,build:buildings,research,galaxy,fleet,leaderboard}[tab])(p)}<footer>Prototyp-Balancing: kurze Zeiten zum Ausprobieren. NPC-Raids folgen später. Rangliste: zuletzt gespeicherte Cloud-Spielstände.</footer></main><nav aria-label="Hauptnavigation">${Object.entries(tabs).map(([key,[icon,label]])=>`<button class="${key===tab?'active':''}" data-action="tab" data-tab="${key}"><span>${icon}</span>${label}</button>`).join('')}</nav>`;if(tab==='fleet')restoreFleetDraft();transportEstimate();fleetEstimates();}
function transportEstimate(){const form=document.getElementById('transport-form');if(!form)return;const d=new FormData(form),p=getPlanet(state,state.active),to=state.planets.find(p=>p.id===d.get('to')),count=Number(d.get('count'));if(!to||!Number.isInteger(count)||count<1)return;const f=flightInfo(state,p,to,count);document.getElementById('transport-estimate').textContent=`${fmt(cargoCapacity(state,count))} Laderaum · ${duration(f.ms)} je Strecke · ${f.fuel} Treibstoff Flugkosten`;}
function settings(){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.innerHTML=`<form method="dialog"><button class="close plain" aria-label="Schließen">×</button></form><span class="eyebrow">SPIELSTAND & HILFE</span><h2>Dein Imperium sichern</h2><p>Lokale Sicherung nach jeder Aktion. Export und Import funktionieren weiterhin.</p>${cloudPanel()}<div class="settings-actions">${button('Spielstand exportieren','export')}${button('Spielstand importieren','import','',readOnly)}<input type="file" id="import-file" accept=".json,application/json" hidden>${button('Neues Spiel starten','reset','class="danger"',readOnly)}</div><h3>So erreichst du deine erste Kolonie</h3><ol><li>Labor 1 bauen, Sensortechnik 1 erforschen.</li><li>Werft bauen; Sonde bauen und unter Galaxie losschicken.</li><li>Labor auf Stufe 2 ausbauen; Kolonisierung erforschen.</li><li>Kolonieschiff bauen; erkundeten Planeten besiedeln.</li><li>Transporttechnik erforschen, Kolonieminen bauen und Materialien nach Hause transportieren.</li></ol><p class="fine">Bauen je Planet, Forschung imperiumsweit und Schiffbau laufen parallel. Energieknappheit reduziert Förderung. Abwesenheit wird bis zur aktuellen Gerätezeit nachberechnet. Gezeitenkraftwerke benötigen Energietechnik 3 und einen Ozeanplaneten.</p>`;document.body.append(d);d.showModal();}
app.addEventListener('submit',e=>{e.preventDefault();if(readOnly||cloudBlocked)return;if(e.target.id==='start-form'){state=newGame(new FormData(e.target).get('name'));persist(true);render();}else if(e.target.id==='transport-form'){const f=new FormData(e.target);command({type:'transport',to:f.get('to'),count:Number(f.get('count')),cargo:Object.fromEntries(RES.map(k=>[k,Number(f.get(k))]))});}});
function command(action){if(readOnly||cloudBlocked){toast(cloudBlocked?'Bitte zuerst den Cloud-Spielstand laden.':'Dieser Tab ist schreibgeschützt.');return;}try{state=act(state,action);persist(true);render();toast('Auftrag gestartet.');}catch(e){toast(e.message);}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(cloudBlocked&&['planet','build','research','ship','probe','colony','import','reset'].includes(a)){toast('Bitte zuerst den Cloud-Spielstand laden.');return;}if(a==='ranking-refresh'){void refreshRanking(true);}else if(a==='tab'){tab=b.dataset.tab;render();if(tab==='leaderboard')void refreshRanking();window.scrollTo({top:0,behavior:'smooth'});}else if(a==='planet'&&!readOnly){state.active=b.dataset.id;persist(true);render();}else if(a==='settings')settings();else if(['build','research','ship','probe','colony'].includes(a)){command({type:a,key:b.dataset.key,to:b.dataset.to,count:1});}else if(a==='export'){try{advance(state,Date.now());const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`wahuelapa-universe-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Sicherung exportiert.');}catch(e){toast(e.message);}}else if(a==='import')document.getElementById('import-file').click();else if(a==='reset'&&!readOnly&&confirm('Wirklich neu starten? Exportiere vorher deinen bisherigen Spielstand.')){if(cloud?.user){state=newGame(state.name);persist(true);void flushCloud();}else{state=null;try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SAVE_KEY+'-backup');}catch{}}document.querySelector('dialog')?.close();render();}});

function cloudPanel(){if(!CLOUD_CONFIG.enabled)return '<p class="fine">Cloud-Anmeldung wird vorbereitet. Aktuell speichert das Spiel automatisch in diesem Browser; Export sichert deinen Fortschritt zusätzlich.</p>';if(cloud?.user)return `<h3>Dein Konto</h3><p>${esc(cloud.user.email)}<br><span id="cloud-status">${esc(cloudMessage)}</span></p><div class="settings-actions">${button('Jetzt Cloud speichern','cloud-save','',cloudBlocked||cloudSaving)}${button('Cloud-Stand laden','cloud-load','',cloudSaving)}${button('Abmelden','cloud-logout','',cloudSaving)}</div><p class="fine">Automatische Cloud-Sicherung spätestens alle 30 Sekunden. Bei Gerätewechsel zuerst speichern. Gleichzeitige Änderungen werden nicht zusammengeführt.</p>`;return `<h3>Anmelden & auf anderen Geräten weiterspielen</h3><form id="cloud-auth-form"><label>E-Mail<input name="email" type="email" required autocomplete="email"></label><label>Passwort<input name="password" type="password" maxlength="128" required autocomplete="current-password"></label><div class="settings-actions"><button type="submit" name="mode" value="login">Anmelden</button><button type="submit" name="mode" value="register">Konto erstellen</button></div></form><p class="fine">Beim ersten Login kannst du deinen Browser-Spielstand übernehmen. Zum Registrieren mindestens 8 Zeichen verwenden und anschließend die Bestätigungsmail öffnen.</p>`;}
function accountSetup(){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.innerHTML=`<span class="eyebrow">DEIN ERSTER CLOUD-SPIELSTAND</span><h2>Willkommen bei WaHueLaPa Universe</h2><p>Für dieses Konto gibt es noch keinen gespeicherten Spielstand.</p>${state?button(`Lokales Imperium von ${esc(state.name)} übernehmen`,'cloud-adopt'):''}<form id="cloud-new-form"><label>Commander-Name<input name="name" maxlength="30" required value="${esc(state?.name||'')}"></label><button>Neues Imperium gründen</button></form>${button('Abmelden','cloud-logout')}<p class="fine">Dein bisheriger Gast-Spielstand bleibt separat erhalten.</p>`;d.addEventListener('cancel',e=>e.preventDefault());document.body.append(d);d.showModal();}
async function loadAccount(discardLocal=false){cloudBlocked=true;cloudMessage='Cloud-Spielstand wird geladen …';refreshCloudBadge();try{let remote=await cloud.load();if(readOnly)return;if(!remote){accountSetup();return;}let meta=null,cached=null;try{meta=JSON.parse(localStorage.getItem(saveKey()+'-cloud-meta')||'null');cached=loadGame(localStorage,saveKey()).state;}catch{toast('Lokale Kontosicherung beschädigt. Cloud-Stand wird verwendet.');}if(!discardLocal&&meta?.pending&&cached){state=advance(cached,Date.now());activeAccountId=cloud.user.id;if(meta.revision!==cloud.revision){cloudMessage='⚠ Lokaler Stand und Cloud unterscheiden sich · exportieren oder Cloud laden';toast('Nicht synchronisierte lokale Änderungen gefunden. Exportiere sie oder lade bewusst den Cloud-Stand.');settings();return;}remote=state;}state=advance(remote,Date.now());activeAccountId=cloud.user.id;cloudBlocked=false;cloudDirty=true;cloudMessage='● Cloud geladen · lokale Sicherung aktiv';try{saveGame(state,localStorage,saveKey());storageOK=true;}catch{storageOK=false;toast('Lokale Sicherung nicht möglich. Bitte exportieren.');}document.querySelector('dialog')?.remove();render();}catch(e){if(activeAccountId!==cloud?.user?.id){try{const cached=loadGame(localStorage,saveKey()).state;if(cached){state=cached;activeAccountId=cloud.user.id;}}catch{}}cloudMessage='⚠ Cloud konnte nicht geladen werden';refreshCloudBadge();toast(e.message||'Cloud nicht erreichbar.');settings();}}
async function flushCloud(){if(readOnly||!cloud?.user||cloudBlocked||cloudSaving||!state)return false;cloudSaving=true;cloudLastAttempt=Date.now();const generation=cloudGeneration;const snapshot=structuredClone(state);cloudMessage='Cloud wird gespeichert …';refreshCloudBadge();try{await cloud.save(snapshot);cloudDirty=cloudGeneration!==generation;cloudLastSave=Date.now();try{localStorage.setItem(saveKey()+'-cloud-meta',JSON.stringify({revision:cloud.revision,pending:cloudDirty}));}catch{}cloudMessage=`● Cloud gespeichert · ${new Date(cloudLastSave).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}`;return true;}catch(e){cloudMessage='⚠ Nur lokal gesichert · Cloud erneut versuchen';if(e instanceof CloudConflict){cloudBlocked=true;cloudMessage='⚠ Anderes Gerät gespeichert · Cloud neu laden';toast(e.message);settings();}else toast(e.message||'Cloud-Speicherung fehlgeschlagen. Lokale Sicherung bleibt erhalten.');return false;}finally{cloudSaving=false;refreshCloudBadge();if(tab==='leaderboard')void refreshRanking();const status=document.getElementById('cloud-status');if(status)status.textContent=cloudMessage;}}
async function finishAccount(initial){if(!cloud?.user||!cloud.loaded||cloud.revision!==0)return;state=initial;activeAccountId=cloud.user.id;cloudBlocked=false;cloudDirty=true;persist(true);const saving=flushCloud();cloudBlocked=true;if(await saving){cloudBlocked=false;document.querySelector('dialog')?.remove();render();}else settings();}
async function logoutAccount(){if(cloud?.user&&!cloudBlocked&&state){const saving=flushCloud();cloudBlocked=true;if(!await saving){cloudBlocked=!cloud.loaded;settings();return;}}cloudBlocked=true;try{await cloud.signOut();clearRanking();activeAccountId=null;state=loadGame().state;if(state)advance(state,Date.now());cloudBlocked=false;cloudDirty=false;document.querySelector('dialog')?.remove();render();}catch(e){toast(e.message);settings();}}
document.addEventListener('submit',async e=>{if(!['cloud-auth-form','cloud-new-form'].includes(e.target.id))return;e.preventDefault();if(readOnly)return;const form=e.target,d=new FormData(form);if(form.id==='cloud-new-form'){await finishAccount(newGame(d.get('name')));return;}if(cloudAuthBusy)return;cloudAuthBusy=true;form.querySelectorAll('button').forEach(b=>b.disabled=true);try{cloud??=await connectCloud(CLOUD_CONFIG);if(e.submitter?.value==='register'){if(String(d.get('password')).length<8)throw Error('Für ein neues Konto bitte mindestens 8 Zeichen verwenden.');await cloud.signUp(String(d.get('email')).trim(),String(d.get('password')));form.reset();toast('Konto angelegt: Bestätigungsmail öffnen und danach anmelden.');}else{await cloud.signIn(String(d.get('email')).trim(),String(d.get('password')));clearRanking();await loadAccount();if(tab==='leaderboard')void refreshRanking(true);}}catch(err){toast(err.message||'Anmeldung fehlgeschlagen.');}finally{cloudAuthBusy=false;form.querySelectorAll('button').forEach(b=>b.disabled=false);}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||readOnly)return;try{switch(b.dataset.action){case 'cloud-save':await flushCloud();break;case 'cloud-load':if(cloud?.user&&confirm('Cloud-Stand laden? Nicht synchronisierte Änderungen werden ersetzt. Bei Bedarf zuerst exportieren.'))await loadAccount(true);break;case 'cloud-logout':await logoutAccount();break;case 'cloud-adopt':if(state)await finishAccount(structuredClone(state));break;}}catch(err){toast(err.message);}});
async function initCloud(){if(!CLOUD_CONFIG.enabled||readOnly)return;cloudBlocked=true;try{cloud=await connectCloud(CLOUD_CONFIG);const user=await cloud.session();if(user)await loadAccount();else cloudBlocked=false;}catch(e){cloudMessage='⚠ Cloud-Verbindung nicht verfügbar';toast(e.message||cloudMessage); // Keep the guest save intact. Explicit login can retry.
 cloudBlocked=false;}render();}
</script></body></html>
